<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>// ACESSO NEGADO // HÉCATE //</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        /* Grade de fundo */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(155, 48, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(155, 48, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            animation: gridPulse 4s ease infinite;
        }

        /* Linhas de varredura */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(155, 48, 255, 0.05) 0px,
                rgba(155, 48, 255, 0.05) 2px,
                transparent 2px,
                transparent 8px
            );
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* Container principal */
        .denied-container {
            position: relative;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid #9b30ff;
            border-radius: 24px;
            padding: 50px 60px;
            max-width: 650px;
            width: 90%;
            z-index: 10;
            box-shadow: 
                0 0 60px rgba(155, 48, 255, 0.4),
                inset 0 0 40px rgba(155, 48, 255, 0.1),
                0 0 120px rgba(155, 48, 255, 0.2);
            animation: borderPulse 1.5s ease infinite alternate;
        }

        @keyframes borderPulse {
            0% { 
                border-color: #9b30ff; 
                box-shadow: 0 0 40px rgba(155, 48, 255, 0.4);
            }
            100% { 
                border-color: #ffd700; 
                box-shadow: 0 0 80px rgba(255, 215, 0, 0.6);
            }
        }

        /* Código glitch */
        .glitch {
            font-size: 80px;
            font-weight: bold;
            font-family: monospace;
            color: #9b30ff;
            text-shadow: 
                4px 4px 0px #ffd700,
                -2px -2px 0px #9b30ff,
                0 0 20px #9b30ff;
            margin-bottom: 20px;
            animation: glitchText 0.3s ease infinite alternate;
            letter-spacing: 8px;
        }

        @keyframes glitchText {
            0% { transform: translate(0); text-shadow: 4px 4px 0px #ffd700, -2px -2px 0px #9b30ff; }
            25% { transform: translate(-2px, 1px); text-shadow: -4px -4px 0px #ffd700, 2px 2px 0px #9b30ff; }
            50% { transform: translate(2px, -1px); text-shadow: 2px -2px 0px #ffd700, -2px 2px 0px #9b30ff; }
            100% { transform: translate(0); text-shadow: 4px 4px 0px #ffd700, -2px -2px 0px #9b30ff; }
        }

        /* Ícone animado */
        .icon {
            font-size: 80px;
            margin: 20px 0;
            filter: drop-shadow(0 0 15px #9b30ff);
            animation: iconPulse 1s ease infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px #9b30ff); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px #ffd700); }
        }

        /* Título */
        .title {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
        }

        /* Linha decorativa */
        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #9b30ff, #ffd700, #9b30ff, transparent);
            margin: 20px auto;
            animation: dividerPulse 2s ease infinite;
        }

        @keyframes dividerPulse {
            0%, 100% { opacity: 0.5; width: 80%; }
            50% { opacity: 1; width: 90%; }
        }

        /* Mensagem */
        .message {
            color: #ffd700;
            font-size: 18px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* Terminal */
        .terminal {
            background: #0a0a0a;
            border-left: 3px solid #9b30ff;
            padding: 15px 20px;
            font-family: monospace;
            font-size: 13px;
            color: #00ff88;
            margin: 20px 0;
            text-align: left;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .terminal span {
            color: #9b30ff;
        }

        .terminal .gold {
            color: #ffd700;
        }

        .terminal .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Status */
        .status {
            font-size: 12px;
            color: #9b30ff;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        /* Barra de progresso */
        .progress {
            width: 100%;
            height: 3px;
            background: rgba(155, 48, 255, 0.3);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #9b30ff, #ffd700);
            animation: loading 3s ease forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Botão */
        .btn {
            background: linear-gradient(135deg, #9b30ff, #ffd700);
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            color: #000;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ffd700;
            letter-spacing: 4px;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Contador de tentativas */
        .attempts-box {
            background: rgba(155, 48, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            margin: 15px 0;
            font-size: 12px;
            color: #9b30ff;
        }

        .attempts-number {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Block info */
        .block-info {
            background: rgba(155, 48, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        .block-info-title {
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .block-info-time {
            font-size: 28px;
            color: #ffd700;
            font-weight: bold;
        }

        /* Partículas */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 4s linear infinite;
            pointer-events: none;
        }

        @keyframes floatParticle {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .denied-container { padding: 30px 20px; }
            .glitch { font-size: 48px; letter-spacing: 4px; }
            .icon { font-size: 60px; }
            .title { font-size: 20px; }
            .message { font-size: 14px; }
            .btn { padding: 10px 20px; font-size: 12px; }
            .terminal { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="denied-container">
        <div class="glitch">// ACESSO NEGADO //</div>
        <div class="icon">🗝️⛔🌙</div>
        <div class="title">HÉCATE - GUARDIÃ DO GRIMÓRIO</div>
        <div class="divider"></div>
        
        <div class="message" id="mainMessage">⚠️ ACESSO NÃO AUTORIZADO ⚠️</div>
        
        <div class="terminal" id="terminal">
            <span>[HÉCATE]</span> Verificando credenciais...<br>
            <span>[SISTEMA]</span> Token de acesso inválido<br>
            <span>[FIREWALL]</span> Redirecionamento detectado<br>
            <span class="gold">[STATUS]</span> <span class="blink">⨯ ACESSO BLOQUEADO ⨯</span>
        </div>
        
        <div id="dynamicInfo"></div>
        
        <div class="status" id="statusMessage">🗝️ COMPLETE O TESTE NO GRIMÓRIO PARA ACESSAR 🗝️</div>
        
        <div class="progress">
            <div class="progress-fill"></div>
        </div>
        
        <button class="btn" id="backToGrimoire">⤺ VOLTAR AO GRIMÓRIO</button>
        <button class="btn" id="forceRetry" style="margin-left: 10px; background: linear-gradient(135deg, #333, #666);">🔄 TENTAR NOVAMENTE</button>
    </div>

    <script>
        // ============================================
        // 🗝️ HÉCATE - PÁGINA DE ACESSO NEGADO
        // Guardiã do Grimório Dimensional
        // ============================================
        
        // 📍 CAMINHO CORRETO PARA O GRIMÓRIO (ABSOLUTO)
        const GRIMOIRE_PATH = '/world_azure/index.html';
        
        // Obter informações da sessão
        const deniedReason = sessionStorage.getItem('access_denied_reason') || 'unauthorized';
        const deniedFrom = sessionStorage.getItem('access_denied_from') || 'unknown';
        
        // Verificar bloqueio da Hécate
        function checkBlockStatus() {
            try {
                // Verificar novas keys da Hécate
                let blockedUntil = localStorage.getItem('hecate_blocked_until');
                let blockCount = localStorage.getItem('hecate_block_count');
                
                // Fallback para keys antigas do Obscurátil
                if (!blockedUntil) blockedUntil = localStorage.getItem('wz_obscuratil_blocked_until');
                if (!blockCount) blockCount = localStorage.getItem('wz_obscuratil_block_count');
                
                if (blockedUntil) {
                    const blockedTime = parseInt(blockedUntil);
                    const now = Date.now();
                    
                    if (now < blockedTime) {
                        const remainingMs = blockedTime - now;
                        const remainingHours = Math.ceil(remainingMs / (1000 * 60 * 60));
                        const remainingDays = Math.floor(remainingHours / 24);
                        
                        let timeText = '';
                        if (remainingDays > 0) {
                            timeText = `${remainingDays} ${remainingDays === 1 ? 'dia' : 'dias'}`;
                        } else {
                            timeText = `${remainingHours} ${remainingHours === 1 ? 'hora' : 'horas'}`;
                        }
                        
                        return {
                            blocked: true,
                            remainingHours: remainingHours,
                            remainingDays: remainingDays,
                            timeText: timeText,
                            blockCount: blockCount || 1
                        };
                    }
                }
                
                // Verificar tentativas
                let attempts = localStorage.getItem('hecate_attempts');
                if (!attempts) attempts = localStorage.getItem('wz_obscuratil_attempts');
                const remainingAttempts = 3 - (parseInt(attempts) || 0);
                
                return {
                    blocked: false,
                    remainingAttempts: remainingAttempts,
                    hasAttempts: remainingAttempts > 0
                };
            } catch (e) {
                return { blocked: false, hasAttempts: true };
            }
        }
        
        // Atualizar interface com informações dinâmicas
        function updateDynamicInfo() {
            const dynamicDiv = document.getElementById('dynamicInfo');
            const blockStatus = checkBlockStatus();
            
            if (blockStatus.blocked) {
                dynamicDiv.innerHTML = `
                    <div class="block-info">
                        <div class="block-info-title">🔒 HÉCATE - FIREWALL ATIVADO - BLOQUEIO #${blockStatus.blockCount}</div>
                        <div class="block-info-time">${blockStatus.timeText}</div>
                        <div style="font-size: 11px; color: #aaa; margin-top: 8px;">Tempo restante até próxima tentativa</div>
                    </div>
                `;
                
                document.getElementById('mainMessage').innerHTML = '⚠️ HÉCATE BLOQUEOU SEU ACESSO ⚠️';
                document.getElementById('statusMessage').innerHTML = `🔒 Aguarde ${blockStatus.timeText} para tentar novamente 🔒`;
            } else if (blockStatus.hasAttempts) {
                dynamicDiv.innerHTML = `
                    <div class="attempts-box">
                        🗝️ TENTATIVAS RESTANTES: <span class="attempts-number">${blockStatus.remainingAttempts}</span>/3<br>
                        <small>Após falhar 3 vezes, Hécate ativará um bloqueio progressivo.</small>
                    </div>
                `;
            } else {
                dynamicDiv.innerHTML = `
                    <div class="attempts-box" style="border-color: #ff3300;">
                        ⛔ VOCÊ ESGOTOU SUAS TENTATIVAS ⛔<br>
                        <small>O firewall da Hécate está ativo. Aguarde o bloqueio expirar.</small>
                    </div>
                `;
            }
            
            // Personalizar mensagem do terminal baseado no motivo
            const terminal = document.getElementById('terminal');
            if (terminal && deniedReason === 'not_authenticated') {
                terminal.innerHTML = `
                    <span>[HÉCATE]</span> Acesso direto detectado<br>
                    <span>[FIREWALL]</span> Você tentou acessar: ${deniedFrom}<br>
                    <span>[SISTEMA]</span> O grimório exige autenticação prévia<br>
                    <span class="gold">[INSTRUÇÃO]</span> Acesse o grimório e complete o teste<br>
                    <span class="blink">⨯ REDIRECIONAMENTO BLOQUEADO ⨯</span>
                `;
            }
        }
        
        // Voltar ao grimório
        function voltarAoGrimorio() {
            console.log('🗝️ Hécate: Redirecionando para o grimório em:', GRIMOIRE_PATH);
            
            // Limpar token de sessão
            sessionStorage.removeItem('wz_access_token');
            sessionStorage.removeItem('access_denied_reason');
            sessionStorage.removeItem('access_denied_from');
            
            // Efeito de transição
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                window.location.href = GRIMOIRE_PATH;
            }, 500);
        }
        
        // Forçar limpeza e tentar novamente
        function forceRetry() {
            if (confirm('⚠️ Isso irá limpar suas tentativas e permitir um novo teste. Deseja continuar?')) {
                // Limpar todas as keys (Hécate e Obscurátil)
                localStorage.removeItem('hecate_attempts');
                localStorage.removeItem('hecate_blocked_until');
                localStorage.removeItem('hecate_block_count');
                localStorage.removeItem('hecate_auth_complete');
                localStorage.removeItem('wz_obscuratil_attempts');
                localStorage.removeItem('wz_obscuratil_blocked_until');
                localStorage.removeItem('wz_obscuratil_block_count');
                localStorage.removeItem('wz_obscuratil_complete');
                localStorage.removeItem('wz_authenticated');
                
                alert('🧹 Dados limpos! Agora você pode tentar novamente.');
                voltarAoGrimorio();
            }
        }
        
        // Verificar se já está autenticado
        function checkIfAlreadyAuthenticated() {
            const authHecate = localStorage.getItem('hecate_auth_complete');
            const authObscuratil = localStorage.getItem('wz_obscuratil_complete');
            const authWz = localStorage.getItem('wz_authenticated');
            
            if (authHecate === 'true' || authObscuratil === 'true' || authWz === 'true') {
                console.log('✅ Usuário já autenticado! Redirecionando para o grimório...');
                voltarAoGrimorio();
            }
        }
        
        // Criar partículas
        function createParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = 3 + Math.random() * 2 + 's';
                particle.style.opacity = 0.3 + Math.random() * 0.5;
                particle.style.background = Math.random() > 0.5 ? '#ffd700' : '#9b30ff';
                document.body.appendChild(particle);
            }
        }
        
        // Efeito de digitação
        function typewriterEffect() {
            const terminal = document.getElementById('terminal');
            if (!terminal) return;
            
            const originalHTML = terminal.innerHTML;
            terminal.innerHTML = '<span>[HÉCATE]</span> <span class="blink">⨯</span>';
            
            let i = 0;
            const fullText = originalHTML;
            const typing = setInterval(() => {
                if (i < fullText.length) {
                    terminal.innerHTML = fullText.substring(0, i + 1);
                    i++;
                } else {
                    clearInterval(typing);
                }
            }, 25);
        }
        
        // Impedir acesso via botão voltar
        function blockHistoryBack() {
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                history.go(1);
                voltarAoGrimorio();
            };
        }
        
        // Eventos
        document.getElementById('backToGrimoire')?.addEventListener('click', voltarAoGrimorio);
        document.getElementById('forceRetry')?.addEventListener('click', forceRetry);
        
        // Inicializar
        createParticles();
        typewriterEffect();
        blockHistoryBack();
        updateDynamicInfo();
        checkIfAlreadyAuthenticated();
        
        console.log('🗝️ Hécate: Página de acesso negado carregada');
        console.log('📝 Motivo:', deniedReason);
        console.log('📍 Tentou acessar:', deniedFrom);
        console.log('🔗 Grimório em:', GRIMOIRE_PATH);
    </script>
</body>
</html>
