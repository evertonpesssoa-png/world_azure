<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DAEDALA • Laboratório Arcano</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/top-icons.css">
    <link rel="stylesheet" href="../shared/css/chat.css">
    <link rel="stylesheet" href="../shared/css/profile-panel.css">
    <link rel="stylesheet" href="../shared/css/portal.css">
    
    <link rel="stylesheet" href="../shared/asuras/daedala/chat-style.css">
    
    <style>
        :root {
            --asura-color: #00ffd5;
            --asura-glow: rgba(0, 255, 213, 0.6);
        }
        body { background: radial-gradient(circle at 30% 20%, #0a1215, #030108); }
        
        .portal-planner-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            color: #00ffd5;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            z-index: 9999;
            border: 2px solid #00ffd5;
            cursor: pointer;
        }
        
        body.transition-out {
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.4s ease;
        }
        
        .chat-container {
            transform: translateY(calc(100% - 48px));
            transition: transform 0.3s ease;
        }
        .chat-container.open { transform: translateY(0); }
        .chat-body.collapsed { display: none; }
    </style>
</head>
<body class="asura-daedala">
    <div id="canvas-container"></div>
    
    <div class="portal-planner-btn" id="portalPlannerBtn">🗺️</div>
    
    <div class="top-icons">
        <div class="top-icon" id="backButton">←</div>
        <div class="top-icon voice-icon" id="voiceButton">
            <span class="brain-icon">💡</span>
            <span class="mic-icon">🎤</span>
        </div>
        <div class="top-icon" id="profileButton">🔧</div>
    </div>
    
    <div class="profile-panel" id="profilePanel"></div>
    
    <div class="chat-container" id="chatContainer">
        <div class="chat-header" id="chatHeader">
            <div class="chat-header-info">
                <div class="chat-avatar">⚗️</div>
                <div><h4>DAEDALA • A Inventora Louca</h4><div class="chat-status">🟢 online | modo caótico criativo</div></div>
            </div>
            <div class="chat-toggle" id="chatToggle">▼</div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
                <button id="sendChatBtn">➤</button>
            </div>
        </div>
    </div>
    
    <div class="portal-overlay" id="portalOverlay"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import { daedalaConfig } from '../shared/asuras/daedala/config.js';
        import { initScene, initControls } from '../shared/asuras/daedala/scene.js';
        import { initLights } from '../shared/asuras/daedala/lights.js';
        import { initFloor } from '../shared/asuras/daedala/floor.js';
        import { initParticles } from '../shared/asuras/daedala/particles.js';
        import { initRings } from '../shared/asuras/daedala/rings.js';
        import { initGears } from '../shared/asuras/daedala/gears.js';
        import { initFlasks } from '../shared/asuras/daedala/flasks.js';
        import { initPanels } from '../shared/asuras/daedala/panels.js';
        import { loadModel } from '../shared/asuras/daedala/model.js';
        import { startAnimation } from '../shared/asuras/daedala/animate.js';
        import { initUI } from '../shared/js/ui.js';
        import { EnhancedChatSystem } from '../shared/js/chat-system-enhanced.js';
        import { VoiceAssistant } from '../shared/js/voice-assistant.js';
        
        // SETUP 3D
        const { scene, camera, renderer } = initScene(daedalaConfig);
        const controls = initControls(camera, renderer);
        const { fillLight, labLight } = initLights(scene, daedalaConfig);
        const circleGlow = initFloor(scene, daedalaConfig);
        const particles = initParticles(scene);
        const { ring, ring2 } = initRings(scene, daedalaConfig);
        initGears(scene);
        initFlasks(scene);
        initPanels(scene);
        
        const { model, mixer } = loadModel(scene, daedalaConfig);
        
        const animation = startAnimation(scene, camera, renderer, controls, particles, ring, ring2, fillLight, circleGlow, labLight);
        if (mixer) animation.setMixer(mixer);
        
        // BOTÃO PORTAL
        document.getElementById('portalPlannerBtn').addEventListener('click', () => {
            localStorage.setItem('lastAsura', 'daedala');
            document.body.classList.add('transition-out');
            const flash = document.createElement('div');
            flash.style.cssText = `position:fixed;inset:0;background:radial-gradient(circle,#00ffd5,transparent);opacity:0;transition:.5s;z-index:10000;`;
            document.body.appendChild(flash);
            requestAnimationFrame(() => {
                flash.style.opacity = '0.8';
                setTimeout(() => window.location.href = '../shared/portals/portal-system.html?asura=daedala', 400);
            });
        });
        
        // BOTÃO VOLTAR DO CELULAR
        function voltarAoGrimorio() {
            document.body.classList.add('transition-out');
            const flash = document.createElement('div');
            flash.style.cssText = `position:fixed;inset:0;background:radial-gradient(circle,${daedalaConfig.color},transparent);opacity:0;transition:.4s;z-index:100000;`;
            document.body.appendChild(flash);
            requestAnimationFrame(() => {
                flash.style.opacity = '0.8';
                setTimeout(() => window.location.href = '../index.html', 350);
            });
        }
        
        window.addEventListener('popstate', (e) => {
            e.preventDefault();
            history.pushState(null, null, location.href);
            voltarAoGrimorio();
        });
        history.pushState(null, null, location.href);
        
        // UI, CHAT E VOZ
        initUI(daedalaConfig);
        
        const chat = new EnhancedChatSystem('chatContainer', daedalaConfig, (response) => {
            if (voice?.isJarvisActive?.()) voice.speak(response);
        });
        
        const voiceButton = document.getElementById('voiceButton');
        let voice = null;
        if (voiceButton) {
            voice = new VoiceAssistant(voiceButton, (text) => {
                document.getElementById('chatInput').value = text;
                chat.send();
            }, null, { asuraName: daedalaConfig.name, continuous: true });
        }
        
        // Toggle do chat
        const chatContainer = document.getElementById('chatContainer');
        const chatToggle = document.getElementById('chatToggle');
        const chatHeader = document.getElementById('chatHeader');
        
        function toggleChat() {
            chatContainer.classList.toggle('open');
        }
        
        if (chatToggle) chatToggle.addEventListener('click', toggleChat);
        if (chatHeader) chatHeader.addEventListener('click', toggleChat);
        
        setTimeout(() => {
            chat.addMessage(daedalaConfig.welcomeMessage, false);
            setTimeout(() => {
                chat.addMessage("🎤 Dica: Clique no ícone 💡 no topo para ativar o MODO JARVIS. Vou ficar sempre ouvindo!", false);
                chat.addMessage("📎 Dica: Clique no ícone 📎 para enviar qualquer arquivo (imagem, PDF, DOC, etc)!", false);
                chat.addMessage("🗺️ Dica: Clique no botão do mapa 🗺️ no TOPO ESQUERDO para acessar o PORTAL PLANNER!", false);
            }, 2000);
        }, 500);
        
        const portalOverlay = document.getElementById('portalOverlay');
        portalOverlay.style.setProperty('--asura-color', daedalaConfig.color);
        setTimeout(() => {
            portalOverlay.style.opacity = '0.6';
            setTimeout(() => {
                portalOverlay.style.opacity = '0';
                setTimeout(() => portalOverlay.style.display = 'none', 800);
            }, 500);
        }, 50);
        
        console.log('🟢 DAEDALA carregada com SUCESSO!');
    </script>
</body>
</html>
