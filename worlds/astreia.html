<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASTREIA • Reino Celestial Azul</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/top-icons.css">
    <link rel="stylesheet" href="../shared/css/chat.css">
    <link rel="stylesheet" href="../shared/css/profile-panel.css">
    <link rel="stylesheet" href="../shared/css/portal.css">

    <style>
        :root {
            --asura-color: #287bff;
            --asura-glow: rgba(40,123,255,.6);
            --asura-gradient: linear-gradient(135deg,#287bff,#6db7ff);
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            overflow:hidden;
            font-family:'Poppins',sans-serif;
            background:
                radial-gradient(circle at top,#123a85 0%,#071124 40%,#02040b 100%);
        }

        #canvas-container{
            position:fixed;
            inset:0;
            z-index:1;
        }

        .portal-planner-btn{
            position:fixed;
            top:20px;
            left:20px;
            width:58px;
            height:58px;
            border-radius:50%;
            border:2px solid #287bff;
            background:rgba(0,0,0,.75);
            backdrop-filter:blur(12px);
            color:#6db7ff;
            font-size:28px;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:9999;
            cursor:pointer;
            box-shadow:0 0 25px rgba(40,123,255,.4);
            transition:.3s;
        }

        .portal-planner-btn:hover{
            transform:scale(1.08);
            box-shadow:0 0 35px rgba(40,123,255,.7);
        }

        body.transition-out{
            opacity:0;
            transform:scale(.98);
            transition:.4s ease;
        }

        /* =========================
           CHAT 3 NÍVEIS
        ========================= */

        .chat-container{
            position:fixed;
            right:28px;
            bottom:28px;
            width:360px;
            z-index:999;
            transition:.3s ease;
        }

        .chat-container.level-0 .chat-body{
            display:none;
        }

        .chat-container.level-1 .chat-body{
            display:flex;
        }

        .chat-container.level-2{
            position:fixed!important;
            inset:0!important;
            width:100vw!important;
            height:100vh!important;
            max-width:none!important;
            border-radius:0!important;
            display:flex!important;
            flex-direction:column!important;
            z-index:999999!important;
        }

        .chat-container.level-2 .chat-header{
            border-radius:0!important;
        }

        .chat-container.level-2 .chat-body{
            flex:1;
            height:100%;
            border-radius:0!important;
        }

        .chat-container.level-2 .chat-messages{
            height:100%!important;
        }

        .chat-header{
            background:rgba(0,0,0,.82);
            border:1px solid rgba(109,183,255,.5);
            border-bottom:none;
            backdrop-filter:blur(16px);
            border-radius:22px 22px 0 0;
            padding:14px 16px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            cursor:pointer;
            box-shadow:0 0 35px rgba(40,123,255,.18);
        }

        .chat-header-info{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .chat-avatar{
            width:38px;
            height:38px;
            border-radius:50%;
            background:var(--asura-gradient);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            box-shadow:0 0 18px rgba(40,123,255,.5);
        }

        .chat-header h4{
            margin:0;
            color:#8fc7ff;
            font-size:.92rem;
            font-weight:600;
        }

        .chat-status{
            font-size:.68rem;
            opacity:.75;
            color:#c8e6ff;
        }

        .chat-header-actions{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .fullscreen-toggle,
        .chat-toggle{
            border:none;
            background:rgba(255,255,255,.08);
            color:#8fc7ff;
            border-radius:10px;
            padding:6px 10px;
            cursor:pointer;
            transition:.25s;
            font-size:15px;
        }

        .fullscreen-toggle:hover,
        .chat-toggle:hover{
            background:rgba(255,255,255,.18);
            transform:scale(1.06);
        }

        .chat-body{
            display:flex;
            flex-direction:column;
            background:rgba(0,0,0,.88);
            border:1px solid rgba(109,183,255,.4);
            border-top:none;
            border-radius:0 0 22px 22px;
            overflow:hidden;
            backdrop-filter:blur(16px);
        }

        .chat-messages{
            height:300px;
            overflow-y:auto;
            padding:14px;
        }

        .chat-messages::-webkit-scrollbar{
            width:6px;
        }

        .chat-messages::-webkit-scrollbar-thumb{
            background:#287bff;
            border-radius:20px;
        }

        .message{
            display:flex;
            gap:10px;
            margin-bottom:14px;
            animation:fadeIn .3s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(8px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .message-avatar{
            width:28px;
            height:28px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
            font-size:.8rem;
        }

        .message.user .message-avatar{
            background:#2e2e2e;
        }

        .message.asura .message-avatar{
            background:var(--asura-gradient);
        }

        .message-content{
            background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.05);
            border-radius:14px;
            padding:10px 12px;
            color:#e7f4ff;
            font-size:.82rem;
            line-height:1.5;
            flex:1;
        }

        .message.asura .message-content{
            border-left:2px solid #287bff;
        }

        .message-time{
            margin-top:5px;
            opacity:.5;
            font-size:.58rem;
        }

        .chat-input-area{
            display:flex;
            align-items:center;
            gap:10px;
            padding:14px;
            border-top:1px solid rgba(255,255,255,.08);
            background:rgba(0,0,0,.4);
        }

        .attach-btn{
            width:42px;
            height:42px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,.08);
            color:white;
            cursor:pointer;
            font-size:18px;
            transition:.25s;
            flex-shrink:0;
        }

        .attach-btn:hover{
            transform:scale(1.06);
            background:rgba(255,255,255,.18);
        }

        .chat-input-area input{
            flex:1;
            min-width:0;
            height:44px;
            border-radius:22px;
            border:1px solid rgba(255,255,255,.12);
            background:rgba(255,255,255,.08);
            color:white;
            padding:0 16px;
            outline:none;
            font-size:.85rem;
        }

        .chat-input-area input:focus{
            border-color:#287bff;
            box-shadow:0 0 15px rgba(40,123,255,.25);
        }

        .chat-input-area button.send-btn{
            min-width:48px;
            height:44px;
            border:none;
            border-radius:22px;
            background:var(--asura-gradient);
            color:white;
            cursor:pointer;
            font-size:18px;
            transition:.25s;
            box-shadow:0 0 18px rgba(40,123,255,.35);
        }

        .chat-input-area button.send-btn:hover{
            transform:scale(1.05);
        }

        .chat-image{
            width:100%;
            border-radius:10px;
            margin-top:8px;
        }

        .chat-file{
            margin-top:8px;
            display:flex;
            align-items:center;
            gap:12px;
            background:rgba(255,255,255,.06);
            padding:10px;
            border-radius:12px;
        }

        .file-icon{
            font-size:28px;
        }

        .file-name{
            font-size:.8rem;
            font-weight:600;
        }

        .file-size{
            font-size:.65rem;
            opacity:.65;
        }

        .file-badge{
            background:#287bff;
            padding:4px 10px;
            border-radius:20px;
            font-size:.7rem;
        }

        @media(max-width:768px){

            .chat-container:not(.level-2){
                width:calc(100vw - 20px);
                right:10px;
                bottom:10px;
            }

            .chat-header{
                padding:12px;
            }

            .chat-messages{
                height:240px;
            }

            .chat-input-area{
                padding:10px;
            }

            .chat-input-area input{
                font-size:16px;
            }

            .portal-planner-btn{
                top:14px;
                left:14px;
                width:52px;
                height:52px;
            }
        }
    </style>
</head>

<body class="asura-astreia">

    <div id="canvas-container"></div>

    <div class="portal-planner-btn" id="portalPlannerBtn">🗺️</div>

    <div class="top-icons">
        <div class="top-icon" id="backButton">←</div>

        <div class="top-icon voice-icon" id="voiceButton">
            <span class="brain-icon">👁️</span>
            <span class="mic-icon">🎤</span>
        </div>

        <div class="top-icon" id="profileButton">👁️</div>
    </div>

    <div class="profile-panel" id="profilePanel"></div>

    <!-- CHAT -->
    <div class="chat-container level-0" id="chatContainer">

        <div class="chat-header" id="chatHeader">

            <div class="chat-header-info">
                <div class="chat-avatar">👁️</div>

                <div>
                    <h4>ASTREIA • Guardiã Celestial</h4>
                    <div class="chat-status">
                        🟢 online • vigilância ativa
                    </div>
                </div>
            </div>

            <div class="chat-header-actions">

                <button class="fullscreen-toggle" id="fullscreenBtn">
                    ⛶
                </button>

                <button class="chat-toggle" id="chatToggle">
                    ▲
                </button>

            </div>

        </div>

        <div class="chat-body" id="chatBody">

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">

                <button class="attach-btn" id="attachBtn">
                    📎
                </button>

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Digite sua mensagem..."
                >

                <button class="send-btn" id="sendChatBtn">
                    ➤
                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden
                >

            </div>

        </div>

    </div>

    <div class="portal-overlay" id="portalOverlay"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // =========================
        // CONFIG
        // =========================

        const astreiaConfig = {
            color: '#287bff'
        };

        // =========================
        // CHAT 3 NÍVEIS
        // =========================

        const chatContainer = document.getElementById('chatContainer');
        const chatToggle = document.getElementById('chatToggle');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const chatHeader = document.getElementById('chatHeader');
        const sendBtn = document.getElementById('sendChatBtn');
        const input = document.getElementById('chatInput');
        const messages = document.getElementById('chatMessages');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');

        let chatLevel = 0;

        function updateChatLevel(){

            chatContainer.classList.remove(
                'level-0',
                'level-1',
                'level-2'
            );

            chatContainer.classList.add(`level-${chatLevel}`);

            chatToggle.innerHTML =
                chatLevel === 0 ? '▲' : '▼';

            fullscreenBtn.innerHTML =
                chatLevel === 2 ? '✖' : '⛶';
        }

        function toggleChat(){

            if(chatLevel === 0){
                chatLevel = 1;
            }
            else if(chatLevel === 1){
                chatLevel = 0;
            }
            else{
                chatLevel = 1;
            }

            updateChatLevel();
        }

        function toggleFullscreen(){

            if(chatLevel !== 2){
                chatLevel = 2;
            }
            else{
                chatLevel = 1;
            }

            updateChatLevel();
        }

        chatHeader.addEventListener('click',(e)=>{

            if(
                e.target.closest('.fullscreen-toggle') ||
                e.target.closest('.chat-toggle')
            ) return;

            toggleChat();
        });

        chatToggle.addEventListener('click',(e)=>{
            e.stopPropagation();
            toggleChat();
        });

        fullscreenBtn.addEventListener('click',(e)=>{
            e.stopPropagation();
            toggleFullscreen();
        });

        // =========================
        // MENSAGENS
        // =========================

        function addMessage(text,isUser=false){

            const div = document.createElement('div');

            div.className =
                `message ${isUser ? 'user' : 'asura'}`;

            const time = new Date()
                .toLocaleTimeString(
                    'pt-BR',
                    {
                        hour:'2-digit',
                        minute:'2-digit'
                    }
                );

            div.innerHTML = `
                <div class="message-avatar">
                    ${isUser ? '👤' : '👁️'}
                </div>

                <div class="message-content">
                    <div>${text}</div>

                    <div class="message-time">
                        ${time}
                    </div>
                </div>
            `;

            messages.appendChild(div);

            messages.scrollTop =
                messages.scrollHeight;
        }

        function sendMessage(){

            const text = input.value.trim();

            if(!text) return;

            addMessage(text,true);

            input.value = '';

            setTimeout(()=>{

                addMessage(
                    '👁️ Sistema celestial ativo. Vigilância funcionando perfeitamente.'
                );

            },600);
        }

        sendBtn.addEventListener('click',sendMessage);

        input.addEventListener('keypress',(e)=>{
            if(e.key === 'Enter'){
                sendMessage();
            }
        });

        // =========================
        // ANEXOS
        // =========================

        attachBtn.addEventListener('click',()=>{
            fileInput.click();
        });

        fileInput.addEventListener('change',(e)=>{

            const file = e.target.files[0];

            if(!file) return;

            const size =
                (file.size / 1024 / 1024)
                .toFixed(2);

            if(file.type.startsWith('image/')){

                const reader = new FileReader();

                reader.onload = (ev)=>{

                    const div =
                        document.createElement('div');

                    div.className =
                        'message user';

                    div.innerHTML = `
                        <div class="message-avatar">
                            👤
                        </div>

                        <div class="message-content">

                            <div>
                                🖼️ ${file.name}
                            </div>

                            <img
                                src="${ev.target.result}"
                                class="chat-image"
                            >

                            <div class="message-time">
                                ${size} MB
                            </div>

                        </div>
                    `;

                    messages.appendChild(div);

                    messages.scrollTop =
                        messages.scrollHeight;
                };

                reader.readAsDataURL(file);

            } else {

                const div =
                    document.createElement('div');

                div.className =
                    'message user';

                div.innerHTML = `
                    <div class="message-avatar">
                        👤
                    </div>

                    <div class="message-content">

                        <div class="chat-file">

                            <div class="file-icon">
                                📎
                            </div>

                            <div>
                                <div class="file-name">
                                    ${file.name}
                                </div>

                                <div class="file-size">
                                    ${size} MB
                                </div>
                            </div>

                            <div class="file-badge">
                                ${file.name.split('.').pop()}
                            </div>

                        </div>

                    </div>
                `;

                messages.appendChild(div);

                messages.scrollTop =
                    messages.scrollHeight;
            }
        });

        // =========================
        // THREE.JS
        // =========================

        const container =
            document.getElementById('canvas-container');

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x040816);

        scene.fog =
            new THREE.FogExp2(0x040816,.008);

        const camera =
            new THREE.PerspectiveCamera(
                45,
                window.innerWidth/window.innerHeight,
                .1,
                1000
            );

        camera.position.set(3,2.2,4.2);

        const renderer =
            new THREE.WebGLRenderer({
                antialias:true
            });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            window.devicePixelRatio
        );

        container.appendChild(renderer.domElement);

        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );

        controls.enableDamping = true;

        // Luzes

        scene.add(
            new THREE.AmbientLight(
                0x3366aa,
                .8
            )
        );

        const light =
            new THREE.DirectionalLight(
                0xaaddff,
                1.3
            );

        light.position.set(3,5,2);

        scene.add(light);

        // Partículas

        const particlesGeometry =
            new THREE.BufferGeometry();

        const count = 1800;

        const positions =
            new Float32Array(count * 3);

        for(let i=0;i<count;i++){

            positions[i*3] =
                (Math.random()-.5)*16;

            positions[i*3+1] =
                Math.random()*6;

            positions[i*3+2] =
                (Math.random()-.5)*16;
        }

        particlesGeometry.setAttribute(
            'position',
            new THREE.BufferAttribute(
                positions,
                3
            )
        );

        const particles =
            new THREE.Points(
                particlesGeometry,
                new THREE.PointsMaterial({
                    color:0x66bbff,
                    size:.03,
                    transparent:true,
                    opacity:.65
                })
            );

        scene.add(particles);

        // Anel

        const ring =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    1.2,
                    .04,
                    32,
                    200
                ),
                new THREE.MeshStandardMaterial({
                    color:0x287bff,
                    emissive:0x287bff,
                    emissiveIntensity:.5
                })
            );

        ring.rotation.x =
            Math.PI/2;

        scene.add(ring);

        // Modelo GLB

        const loader =
            new GLTFLoader();

        loader.load(
            '../models/astreia.glb',
            (gltf)=>{

                const model =
                    gltf.scene;

                model.scale.set(
                    .04,
                    .04,
                    .04
                );

                model.position.y =
                    -.25;

                scene.add(model);
            }
        );

        // =========================
        // ANIMAÇÃO
        // =========================

        let time = 0;

        function animate(){

            requestAnimationFrame(
                animate
            );

            time += .01;

            particles.rotation.y =
                time * .08;

            ring.rotation.z =
                time * .4;

            controls.update();

            renderer.render(
                scene,
                camera
            );
        }

        animate();

        // =========================
        // RESIZE
        // =========================

        window.addEventListener(
            'resize',
            ()=>{

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );

        // =========================
        // BOAS VINDAS
        // =========================

        setTimeout(()=>{

            addMessage(
                '👁️ Bem-vindo ao Reino Celestial. Sou Astreia.'
            );

            setTimeout(()=>{

                addMessage(
                    '📎 Agora o chat aceita imagens e arquivos.'
                );

                addMessage(
                    '⛶ O modo tela inteira foi corrigido.'
                );

            },1200);

        },600);

    </script>

</body>
</html>
