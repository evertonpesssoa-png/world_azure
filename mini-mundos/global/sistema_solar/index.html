<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sistema Solar - 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sun">
            <img src="./images/sun.png" alt="Sol">
        </div>
        
        <div class="mercury" data-name="Mercúrio"></div>
        <div class="venus" data-name="Vênus"></div>
        <div class="earth" data-name="Terra">
            <div class="moon" data-name="Lua"></div>
        </div>
        <div class="mars" data-name="Marte"></div>
        <div class="jupiter" data-name="Júpiter"></div>
        <div class="saturn" data-name="Saturno"></div>
        <div class="uranus" data-name="Urano"></div>
        <div class="neptune" data-name="Netuno"></div>
        <div class="pluto" data-name="Plutão"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
