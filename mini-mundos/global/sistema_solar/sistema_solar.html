<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Sistema Solar - 3D</title>


    <!-- =====================================================
         HÉCATE
         IMPORTS OBRIGATÓRIOS
    ====================================================== -->

    <script src="/world_azure/shared/js/hecate/core.js"></script>

    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>

    <script src="/world_azure/shared/js/hecate/test-system.js"></script>

    <script src="/world_azure/shared/js/hecate/auth.js"></script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         SISTEMA SOLAR
         
         O touch-action impede o navegador de assumir
         o gesto de dois dedos e deixa o nosso JS
         controlar o zoom.
    ====================================================== -->

    <div
        class="container"
        style="touch-action: none;"
    >


        <!-- =================================================
             SOL - CLICÁVEL
        ================================================== -->

        <div 
            class="sun" 
            data-name="Sol"
            data-key="sun"
        >

            <img
                src="./images/sun.png"
                alt="Sol"
            >

        </div>


        <!-- =================================================
             PLANETAS - CLICÁVEIS
        ================================================== -->

        <div 
            class="mercury" 
            data-name="Mercúrio"
            data-key="mercury"
        ></div>


        <div 
            class="venus" 
            data-name="Vênus"
            data-key="venus"
        ></div>


        <div 
            class="earth" 
            data-name="Terra"
            data-key="earth"
        >

            <!-- =============================================
                 LUA - CLICÁVEL
            ============================================== -->

            <div 
                class="moon" 
                data-name="Lua"
                data-key="moon"
            ></div>

        </div>


        <div 
            class="mars" 
            data-name="Marte"
            data-key="mars"
        ></div>


        <div 
            class="jupiter" 
            data-name="Júpiter"
            data-key="jupiter"
        ></div>


        <div 
            class="saturn" 
            data-name="Saturno"
            data-key="saturn"
        ></div>


        <div 
            class="uranus" 
            data-name="Urano"
            data-key="uranus"
        ></div>


        <div 
            class="neptune" 
            data-name="Netuno"
            data-key="neptune"
        ></div>


        <div 
            class="pluto" 
            data-name="Plutão"
            data-key="pluto"
        ></div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
