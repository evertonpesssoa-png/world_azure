<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Sistema Solar - 3D</title>


    <!-- =====================================================
         HÉCATE
         IMPORTS OBRIGATÓRIOS
    ====================================================== -->

    <script src="/world_azure/shared/js/hecate/core.js"></script>

    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>

    <script src="/world_azure/shared/js/hecate/test-system.js"></script>

    <script src="/world_azure/shared/js/hecate/auth.js"></script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         SISTEMA SOLAR
         
         O container recebe o zoom por pinça através
         do script.js.
    ====================================================== -->

    <div
        class="container"
        style="touch-action: none;"
    >


        <!-- =================================================
             SOL
        ================================================== -->

        <div class="sun">

            <img
                src="./images/sun.png"
                alt="Sol"
            >

        </div>


        <!-- =================================================
             MERCÚRIO
             
             .mercury
             → órbita ao redor do Sol

             .planet
             → rotação própria
        ================================================== -->

        <div
            class="mercury"
            data-name="Mercúrio"
        >

            <div
                class="planet mercury-planet"
            ></div>

        </div>


        <!-- =================================================
             VÊNUS
        ================================================== -->

        <div
            class="venus"
            data-name="Vênus"
        >

            <div
                class="planet venus-planet"
            ></div>

        </div>


        <!-- =================================================
             TERRA
             
             .earth
             → órbita ao redor do Sol

             .earth-planet
             → rotação própria da Terra

             .moon
             → órbita ao redor da Terra
        ================================================== -->

        <div
            class="earth"
            data-name="Terra"
        >

            <div
                class="planet earth-planet"
            ></div>


            <!-- =============================================
                 LUA
            ============================================== -->

            <div
                class="moon"
                data-name="Lua"
            ></div>

        </div>


        <!-- =================================================
             MARTE
        ================================================== -->

        <div
            class="mars"
            data-name="Marte"
        >

            <div
                class="planet mars-planet"
            ></div>

        </div>


        <!-- =================================================
             JÚPITER
        ================================================== -->

        <div
            class="jupiter"
            data-name="Júpiter"
        >

            <div
                class="planet jupiter-planet"
            ></div>

        </div>


        <!-- =================================================
             SATURNO
        ================================================== -->

        <div
            class="saturn"
            data-name="Saturno"
        >

            <div
                class="planet saturn-planet"
            ></div>

        </div>


        <!-- =================================================
             URANO
        ================================================== -->

        <div
            class="uranus"
            data-name="Urano"
        >

            <div
                class="planet uranus-planet"
            ></div>

        </div>


        <!-- =================================================
             NETUNO
        ================================================== -->

        <div
            class="neptune"
            data-name="Netuno"
        >

            <div
                class="planet neptune-planet"
            ></div>

        </div>


        <!-- =================================================
             PLUTÃO
        ================================================== -->

        <div
            class="pluto"
            data-name="Plutão"
        >

            <div
                class="planet pluto-planet"
            ></div>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         
         Mantido igual.
         Zoom + estrelas + Lua continuam sendo
         controlados pelo script.js.
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
