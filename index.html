    <!-- ============================================ -->
    <!-- CÓDIGO PRINCIPAL DO GRIMÓRIO COM TAROT -->
    <!-- ============================================ -->

    <script>
        (function() {
            'use strict';

            // ============================================
            // CONFIGURAÇÕES
            // ============================================

            const CONFIG = {
                TRANSITION_DURATION: 4200,
                CLONE_FADE_DURATION: 3500,
                AUDIO_FADE_STEP: 0.015,
                AUDIO_FADE_INTERVAL: 30,
                PARTICLE_INTERVAL: 400,
                PARTICLE_LIFETIME: 2000,
                BACKGROUND_PARTICLES: 120,
                MUSIC_VOLUME: 0.12,
                HOVER_VOLUME: 0.12,
                PORTAL_VOLUME: 0.2,
                SPARK_COUNT: 50,
                DEBOUNCE_DELAY: 300
            };

            // ============================================
            // DOM ELEMENTOS
            // ============================================

            const items = document.querySelectorAll(".item");
            const slider = document.querySelector(".slider");
            const hoverSound = document.getElementById("hoverSound");
            const bgMusic = document.getElementById("bgMusic");
            const portalTransition = document.getElementById("portalTransition");
            const toggleMusicBtn = document.getElementById("toggleMusic");
            const toggleSoundBtn = document.getElementById("toggleSound");
            const musicIcon = document.getElementById("musicIcon");
            const soundIcon = document.getElementById("soundIcon");

            // ============================================
            // ESTADO
            // ============================================

            let transitioning = false;
            let isMusicMuted = false;
            let isSoundMuted = false;
            let musicFadeInterval = null;
            let particleIntervals = [];

            // ============================================
            // 🎴 INFORMAÇÕES DAS CARTAS DE TAROT
            // ============================================

            const tarotInfo = {
                'diva': {
                    number: 'I',
                    name: 'A ILUSIONISTA',
                    symbols: ['🌀', '✦', '🌀', '✦'],
                    runes: ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ']
                },
                'siria': {
                    number: 'VII',
                    name: 'A FORTUNA',
                    symbols: ['🌳', '💰', '🌳', '💰'],
                    runes: ['ᚱ', 'ᚲ', 'ᚷ', 'ᚹ']
                },
                'astreia': {
                    number: 'XII',
                    name: 'A PROTETORA',
                    symbols: ['🛡️', '⚔️', '🛡️', '⚔️'],
                    runes: ['ᚺ', 'ᚾ', 'ᛁ', 'ᛃ']
                },
                'merlim': {
                    number: 'V',
                    name: 'A FEITICEIRA',
                    symbols: ['⚗️', '🔮', '⚗️', '🔮'],
                    runes: ['ᛈ', 'ᛇ', 'ᛉ', 'ᛊ']
                },
                'umbra': {
                    number: 'XIII',
                    name: 'A CAÇADORA',
                    symbols: ['🗡️', '🎯', '🗡️', '🎯'],
                    runes: ['ᛏ', 'ᛒ', 'ᛖ', 'ᛗ']
                },
                'atena': {
                    number: 'III',
                    name: 'A MESTRA',
                    symbols: ['📚', '🦉', '📚', '🦉'],
                    runes: ['ᛚ', 'ᛝ', 'ᛟ', 'ᛞ']
                },
                'victoria': {
                    number: 'VI',
                    name: 'A GENERAL',
                    symbols: ['⚔️', '🏛️', '⚔️', '🏛️'],
                    runes: ['ᚪ', 'ᚫ', 'ᚣ', 'ᛡ']
                },
                'hestia': {
                    number: 'XV',
                    name: 'A ORÁCULO',
                    symbols: ['🔮', '👁️', '🔮', '👁️'],
                    runes: ['ᛠ', 'ᛢ', 'ᛣ', 'ᛤ']
                },
                'daedala': {
                    number: 'IV',
                    name: 'A INVENTORA',
                    symbols: ['⚙️', '🔧', '⚙️', '🔧'],
                    runes: ['ᛥ', 'ᛦ', 'ᛧ', 'ᛨ']
                }
            };

            // ============================================
            // 🎴 APLICAR ESTILO TAROT NOS CARDS
            // ============================================

            function applyTarotStyles() {
                items.forEach(item => {
                    const asura = item.dataset.asura;
                    const info = tarotInfo[asura];

                    if (info) {
                        item.classList.add('tarot-card');

                        // Número
                        const numberSpan = document.createElement('span');
                        numberSpan.className = 'tarot-number';
                        numberSpan.textContent = info.number;
                        item.appendChild(numberSpan);

                        // Nome
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'tarot-name';
                        nameSpan.textContent = info.name;
                        item.appendChild(nameSpan);

                        // Símbolos
                        const positions = ['tl', 'tr', 'bl', 'br'];
                        info.symbols.forEach((sym, i) => {
                            const symSpan = document.createElement('span');
                            symSpan.className = `tarot-symbol ${positions[i]}`;
                            symSpan.textContent = sym;
                            item.appendChild(symSpan);
                        });

                        // Runas
                        const runePositions = ['top', 'right', 'bottom', 'left'];
                        info.runes.forEach((rune, i) => {
                            const runeSpan = document.createElement('span');
                            runeSpan.className = `rune ${runePositions[i]}`;
                            runeSpan.textContent = rune;
                            item.appendChild(runeSpan);
                        });

                        // Runas dos cantos
                        const cornerRunas = ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ'];
                        const cornerPositions = ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'];
                        cornerRunas.forEach((rune, i) => {
                            const runeSpan = document.createElement('span');
                            runeSpan.className = `rune ${cornerPositions[i]}`;
                            runeSpan.textContent = rune;
                            runeSpan.style.fontSize = '10px';
                            item.appendChild(runeSpan);
                        });

                        // Holograma
                        const holoLayer = document.createElement('div');
                        holoLayer.className = 'holo-layer';
                        item.appendChild(holoLayer);

                        // Partículas da carta (apenas se não for mobile pequeno)
                        if (window.innerWidth > 480) {
                            createCardParticles(item);
                        }
                    }
                });
            }

            // ============================================
            // 💫 PARTÍCULAS DA CARTA
            // ============================================

            function createCardParticles(item) {
                const container = document.createElement('div');
                container.className = 'particle-container';
                item.appendChild(container);

                const interval = setInterval(() => {
                    if (item.classList.contains('fade-all') || 
                        item.classList.contains('active') || 
                        item.style.opacity === '0' || 
                        item.style.opacity === '0.08') {
                        return;
                    }

                    const rect = item.getBoundingClientRect();
                    if (rect.width === 0 || rect.height === 0) return;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const count = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';

                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 30 + 10;
                        const startX = centerX + Math.cos(angle) * distance - 2;
                        const startY = centerY + Math.sin(angle) * distance - 2;

                        particle.style.left = startX + 'px';
                        particle.style.top = startY + 'px';

                        const dirAngle = Math.random() * Math.PI * 2;
                        const speed = 20 + Math.random() * 40;
                        const tx = Math.cos(dirAngle) * speed;
                        const ty = Math.sin(dirAngle) * speed;

                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');
                        particle.style.setProperty('--glow-color', item.dataset.color);

                        const size = 2 + Math.random() * 4;
                        particle.style.width = size + 'px';
                        particle.style.height = size + 'px';
                        particle.style.background = item.dataset.color;
                        particle.style.boxShadow = `0 0 ${size * 2}px ${item.dataset.color}`;

                        container.appendChild(particle);

                        setTimeout(() => {
                            if (particle.parentNode) {
                                particle.remove();
                            }
                        }, CONFIG.PARTICLE_LIFETIME);
                    }
                }, CONFIG.PARTICLE_INTERVAL);

                particleIntervals.push(interval);
            }

            // ============================================
            // 🎨 CORES DINÂMICAS
            // ============================================

            function applyDynamicColors() {
                items.forEach(item => {
                    const color = item.dataset.color;
                    item.style.setProperty("--glow-color", color);
                });
            }

            // ============================================
            // 🔊 SISTEMA DE ÁUDIO
            // ============================================

            function setupAudio() {
                // Hover sound
                items.forEach(item => {
                    item.addEventListener("mouseenter", () => {
                        if (!isSoundMuted && hoverSound) {
                            hoverSound.volume = CONFIG.HOVER_VOLUME;
                            hoverSound.currentTime = 0;
                            hoverSound.play().catch(() => {});
                        }
                    });
                });

                // Background music
                if (bgMusic) {
                    bgMusic.volume = 0;
                    bgMusic.play().then(() => {
                        setTimeout(() => {
                            if (!isMusicMuted) {
                                bgMusic.volume = CONFIG.MUSIC_VOLUME;
                            }
                        }, 800);
                    }).catch(() => {
                        const playMusic = () => {
                            if (!isMusicMuted) {
                                bgMusic.volume = CONFIG.MUSIC_VOLUME;
                                bgMusic.play().catch(() => {});
                            }
                            document.removeEventListener('click', playMusic);
                            document.removeEventListener('touchstart', playMusic);
                        };
                        document.addEventListener('click', playMusic, { once: true });
                        document.addEventListener('touchstart', playMusic, { once: true });
                    });
                }

                // Controles de áudio
                if (toggleMusicBtn) {
                    toggleMusicBtn.addEventListener('click', toggleMusic);
                }

                if (toggleSoundBtn) {
                    toggleSoundBtn.addEventListener('click', toggleSound);
                }
            }

            function toggleMusic() {
                isMusicMuted = !isMusicMuted;
                if (bgMusic) {
                    bgMusic.volume = isMusicMuted ? 0 : CONFIG.MUSIC_VOLUME;
                }
                if (musicIcon) {
                    musicIcon.textContent = isMusicMuted ? '🔇' : '🔊';
                }
                if (toggleMusicBtn) {
                    toggleMusicBtn.classList.toggle('muted', isMusicMuted);
                }
                console.log(`🎵 Música ${isMusicMuted ? '🔇 mutada' : '🔊 ativada'}`);
            }

            function toggleSound() {
                isSoundMuted = !isSoundMuted;
                if (soundIcon) {
                    soundIcon.textContent = isSoundMuted ? '🔇' : '🔊';
                }
                if (toggleSoundBtn) {
                    toggleSoundBtn.classList.toggle('muted', isSoundMuted);
                }
                console.log(`🔊 Efeitos sonoros ${isSoundMuted ? '🔇 mutados' : '🔊 ativados'}`);
            }

            function fadeOutMusic() {
                if (musicFadeInterval) {
                    clearInterval(musicFadeInterval);
                }
                musicFadeInterval = setInterval(() => {
                    if (bgMusic && bgMusic.volume > CONFIG.AUDIO_FADE_STEP) {
                        bgMusic.volume -= CONFIG.AUDIO_FADE_STEP;
                    } else {
                        if (bgMusic) bgMusic.volume = 0;
                        clearInterval(musicFadeInterval);
                        musicFadeInterval = null;
                    }
                }, CONFIG.AUDIO_FADE_INTERVAL);
            }

            function restoreMusic() {
                if (musicFadeInterval) {
                    clearInterval(musicFadeInterval);
                    musicFadeInterval = null;
                }
                if (bgMusic && !isMusicMuted) {
                    bgMusic.volume = CONFIG.MUSIC_VOLUME;
                }
            }

            // ============================================
            // ✨ PARTÍCULAS DE FUNDO
            // ============================================

            function setupBackgroundParticles() {
                const canvas = document.getElementById("particles");
                if (!canvas) return;

                const ctx = canvas.getContext("2d");

                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resizeCanvas();
                window.addEventListener("resize", resizeCanvas);

                const particles = [];
                const count = window.innerWidth <= 480 ? 60 : CONFIG.BACKGROUND_PARTICLES;

                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2 + 1,
                        speedX: (Math.random() - 0.5) * 0.3,
                        speedY: (Math.random() - 0.5) * 0.3,
                        opacity: Math.random() * 0.5
                    });
                }

                let animationId = null;

                function drawParticles() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
                        ctx.fill();
                        p.x += p.speedX;
                        p.y += p.speedY;
                        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                    });
                    animationId = requestAnimationFrame(drawParticles);
                }
                drawParticles();

                return () => {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                    }
                };
            }

            // ============================================
            // 🚀 TRANSIÇÃO PORTAL
            // ============================================

            function createPortalFlash(color) {
                const flash = document.createElement("div");
                flash.className = "portal-flash";
                flash.style.setProperty("--flash-color", color);
                document.body.appendChild(flash);
                requestAnimationFrame(() => flash.classList.add("show"));
                setTimeout(() => {
                    flash.classList.remove("show");
                    setTimeout(() => flash.remove(), 1000);
                }, 900);
            }

            function createSparkles(color, count = CONFIG.SPARK_COUNT) {
                const isMobile = window.innerWidth <= 480;
                const actualCount = isMobile ? Math.floor(count / 2) : count;
                const sparkColors = [color, '#ffffff', '#ffd700', '#ff6b6b', '#4ecdc4', '#ff9ff3'];

                for (let i = 0; i < actualCount; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'portal-spark';
                    
                    const size = (isMobile ? 1 : 2) + Math.random() * (isMobile ? 2 : 4);
                    const angle = Math.random() * Math.PI * 2;
                    const distance = isMobile ? (50 + Math.random() * 150) : (100 + Math.random() * 300);
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    spark.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        background: ${sparkColors[Math.floor(Math.random() * sparkColors.length)]};
                        top: ${45 + Math.random() * 10}%;
                        left: ${45 + Math.random() * 10}%;
                        box-shadow: 0 0 ${size * 3}px ${color};
                        --tx: ${tx}px;
                        --ty: ${ty}px;
                        animation-delay: ${Math.random() * 0.5}s;
                        animation-duration: ${(isMobile ? 1.5 : 2.0) + Math.random() * (isMobile ? 0.8 : 1.0)}s;
                        z-index: 99999;
                    `;
                    
                    document.body.appendChild(spark);
                    
                    setTimeout(() => {
                        if (spark.parentNode) spark.remove();
                    }, 3000);
                }
            }

            function startAsuraTransition(selectedItem, asura) {
                if (transitioning) return;
                transitioning = true;

                console.log(`🚀 Iniciando transição para: ${asura}`);

                try {
                    const glowColor = selectedItem.dataset.color;
                    const imgSrc = selectedItem.querySelector('img').src;

                    // Pegar elementos da carta
                    const numberSpan = selectedItem.querySelector('.tarot-number');
                    const nameSpan = selectedItem.querySelector('.tarot-name');
                    const symbolSpans = selectedItem.querySelectorAll('.tarot-symbol');
                    const runeSpans = selectedItem.querySelectorAll('.rune');
                    
                    const number = numberSpan ? numberSpan.textContent : '?';
                    const name = nameSpan ? nameSpan.textContent : '?';
                    
                    const symbols = [];
                    const runes = [];
                    symbolSpans.forEach(el => symbols.push(el.textContent));
                    runeSpans.forEach(el => runes.push(el.textContent));

                    // Detecta dispositivo para ajustes
                    const isMobile = window.innerWidth <= 768;
                    const isSmallMobile = window.innerWidth <= 480;
                    const isTablet = window.innerWidth > 768 && window.innerWidth <= 1024;

                    // ============================================
                    // 1. CRIAR CLONE FULLSCREEN
                    // ============================================

                    const clone = document.createElement('div');
                    clone.className = 'portal-card-fullscreen';
                    clone.style.setProperty('--glow-color', glowColor);

                    // Imagem
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = asura;
                    clone.appendChild(img);

                    // Número
                    const numClone = document.createElement('span');
                    numClone.className = 'tarot-number-full';
                    numClone.textContent = number;
                    clone.appendChild(numClone);

                    // Nome
                    const nameClone = document.createElement('span');
                    nameClone.className = 'tarot-name-full';
                    nameClone.textContent = name;
                    clone.appendChild(nameClone);

                    // Símbolos
                    const symbolPositions = ['tl', 'tr', 'bl', 'br'];
                    symbols.forEach((sym, i) => {
                        if (i < 4) {
                            const symClone = document.createElement('span');
                            symClone.className = `tarot-symbol-full ${symbolPositions[i]}`;
                            symClone.textContent = sym;
                            clone.appendChild(symClone);
                        }
                    });

                    // Runas
                    const runePositions = ['top', 'right', 'bottom', 'left'];
                    runes.forEach((rune, i) => {
                        if (i < 4) {
                            const runeClone = document.createElement('span');
                            runeClone.className = `rune-full ${runePositions[i]}`;
                            runeClone.textContent = rune;
                            clone.appendChild(runeClone);
                        }
                    });

                    // Holograma
                    const holoClone = document.createElement('div');
                    holoClone.className = 'holo-layer-full';
                    clone.appendChild(holoClone);

                    document.body.appendChild(clone);

                    // ============================================
                    // 2. CONGELAR CARROSSEL
                    // ============================================

                    if (slider) {
                        slider.style.animationPlayState = "paused";
                        slider.classList.add("fade-all");
                    }
                    selectedItem.classList.add("active");

                    // ============================================
                    // 3. EFEITOS
                    // ============================================

                    // Som do portal
                    if (!isSoundMuted && hoverSound) {
                        hoverSound.volume = isMobile ? 0.15 : CONFIG.PORTAL_VOLUME;
                        hoverSound.currentTime = 0;
                        hoverSound.play().catch(() => {});
                    }

                    // Fade da música
                    fadeOutMusic();

                    // Overlay escuro
                    const overlay = document.createElement('div');
                    overlay.className = 'portal-overlay';
                    document.body.appendChild(overlay);
                    setTimeout(() => {
                        overlay.classList.add('active');
                    }, isMobile ? 200 : 350);

                    // Sparkles
                    createSparkles(glowColor);

                    // Flash branco
                    const flash = document.createElement('div');
                    flash.style.cssText = `
                        position: fixed;
                        inset: 0;
                        background: radial-gradient(circle, white, transparent 70%);
                        z-index: 99999;
                        opacity: 0;
                        pointer-events: none;
                        transition: opacity 0.6s ease;
                    `;
                    document.body.appendChild(flash);

                    const flashDelay = isSmallMobile ? 1800 : isMobile ? 2000 : 2500;

                    setTimeout(() => {
                        flash.style.opacity = isMobile ? '0.5' : '0.7';
                        setTimeout(() => {
                            flash.style.opacity = '0';
                            setTimeout(() => flash.remove(), 400);
                        }, 400);
                    }, flashDelay);

                    // Flash colorido
                    createPortalFlash(glowColor);

                    // Body scale
                    document.body.style.transition = "transform 1.6s ease";
                    document.body.style.transform = isMobile ? "scale(1.01)" : "scale(1.03)";

                    if (portalTransition) portalTransition.classList.add("active");

                    // ============================================
                    // 4. LIMPEZA E REDIRECIONAMENTO
                    // ============================================

                    const fullscreenDuration = isSmallMobile ? 2500 : isMobile ? 3000 : isTablet ? 3500 : 4200;

                    console.log(`✅ Portal aberto para: ${asura} (${isMobile ? 'Mobile' : isTablet ? 'Tablet' : 'Desktop'})`);

                    setTimeout(() => {
                        if (clone && clone.parentNode) {
                            clone.style.transition = 'opacity 0.5s ease';
                            clone.style.opacity = '0';
                            setTimeout(() => {
                                if (clone.parentNode) clone.remove();
                            }, 500);
                        }
                    }, fullscreenDuration - 500);

                    setTimeout(() => {
                        window.location.href = "/world_azure/viagem.html?asura=" + asura;
                    }, fullscreenDuration + 200);

                } catch (error) {
                    console.error('❌ Erro na transição:', error);
                    transitioning = false;
                    restoreMusic();
                    if (slider) {
                        slider.style.animationPlayState = "running";
                        slider.classList.remove("fade-all");
                    }
                    items.forEach(item => item.classList.remove('active'));
                }
            }

            // ============================================
            // DEBOUNCE
            // ============================================

            function debounce(func, wait) {
                let timeout;
                return function(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            // ============================================
            // 🗝️ HÉCATE - SISTEMA DE AUTENTICAÇÃO
            // ============================================

            function liberarCards() {
                console.log('🔓 Liberando cards...');
                items.forEach(item => {
                    item.classList.remove('hecate-blocked');
                    item.style.pointerEvents = "";
                    item.style.opacity = "";
                    item.style.filter = "";
                    item.removeEventListener('click', handleCardClick);
                    item.addEventListener('click', handleCardClick);
                    
                    // Suporte a teclado
                    item.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleCardClick.call(item, e);
                        }
                    });
                });
            }

            function bloquearCards() {
                console.log('🔒 Bloqueando cards...');
                items.forEach(item => {
                    item.classList.add('hecate-blocked');
                    item.style.pointerEvents = "none";
                    item.style.opacity = "0.4";
                    item.style.filter = "blur(2px)";
                    item.removeEventListener('click', handleCardClick);
                    item.setAttribute('aria-disabled', 'true');
                });
            }

            const handleCardClick = debounce(function(e) {
                const item = e.currentTarget || this;
                if (item.classList.contains('hecate-blocked')) return;
                startAsuraTransition(item, item.dataset.asura);
            }, CONFIG.DEBOUNCE_DELAY);

            function initHecate() {
                console.log('🔍 Verificando autenticação...');
                console.log('localStorage hecate_auth_complete:', localStorage.getItem('hecate_auth_complete'));

                if (localStorage.getItem('hecate_auth_complete') === 'true') {
                    console.log('✅ Usuário já autenticado - Liberando cards');
                    liberarCards();
                    return;
                }

                console.log('🔒 Usuário NÃO autenticado - Bloqueando cards');
                bloquearCards();

                let testeAtivo = false;

                function ativarHecate() {
                    if (testeAtivo) return;
                    testeAtivo = true;
