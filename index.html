<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/world_azure/style.css">

    <!-- 🔥 PRÉ-CARREGAMENTO DA IMAGEM DO MAGO -->
    <link rel="preload" as="image" href="/world_azure/images/mago5_hq.png">

    <title>ASURAS - Grimório Dimensional | Hécate Guardiã</title>

</head>

<body>

    <div class="banner">

        <canvas id="particles"></canvas>

        <!-- MAGO FORA DO SLIDER -->
        <div class="mago-center"></div>

        <!-- ==========================================
             🎴 CARROSSEL DAS ASURAS
        =========================================== -->

        <div class="slider" style="--quantity: 9">

            <div class="item"
                 data-asura="diva"
                 data-color="#ff4db8"
                 style="--position: 1">

                <img src="/world_azure/images/diva2_hq.png"
                     alt="Diva"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="siria"
                 data-color="#35ff9c"
                 style="--position: 2">

                <img src="/world_azure/images/siria2_hq.png"
                     alt="Siria"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="merlim"
                 data-color="#00d9ff"
                 style="--position: 3">

                <img src="/world_azure/images/merlim3_hq.png"
                     alt="Merlim"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="astreia"
                 data-color="#287bff"
                 style="--position: 4">

                <img src="/world_azure/images/astreia3_hq.png"
                     alt="Astreia"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="umbra"
                 data-color="#8b2fff"
                 style="--position: 5">

                <img src="/world_azure/images/umbra2_hq.png"
                     alt="Umbra"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="atena"
                 data-color="#ffd54f"
                 style="--position: 6">

                <img src="/world_azure/images/atena2_hq.png"
                     alt="Atena"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="victoria"
                 data-color="#ff4444"
                 style="--position: 7">

                <img src="/world_azure/images/victoria3_hq.png"
                     alt="Victoria"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="hestia"
                 data-color="#fff0b3"
                 style="--position: 8">

                <img src="/world_azure/images/hestia3_hq.png"
                     alt="Hestia"
                     draggable="false">

            </div>


            <div class="item"
                 data-asura="daedala"
                 data-color="#00ffd5"
                 style="--position: 9">

                <img src="/world_azure/images/daedala3_hq.png"
                     alt="Daedala"
                     draggable="false">

            </div>

        </div>

        <div class="content"></div>

    </div>


    <!-- PORTAL -->
    <div id="portalTransition" class="portal-flash"></div>


    <!-- ÁUDIO -->
    <audio
        id="hoverSound"
        src="/world_azure/sounds/hover.mp3"
        preload="auto">
    </audio>


    <audio
        id="bgMusic"
        src="/world_azure/sounds/ambient.mp3"
        loop
        preload="auto"
        playsinline>
    </audio>


    <!-- ==========================================
         HÉCATE
    =========================================== -->

    <script src="/world_azure/shared/js/hecate/core.js"></script>
    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>
    <script src="/world_azure/shared/js/hecate/test-system.js"></script>
    <script src="/world_azure/shared/js/hecate/auth.js"></script>


    <!-- ==========================================
         CÓDIGO PRINCIPAL
    =========================================== -->

    <script>

        (function() {

            "use strict";


            // ==========================================
            // ELEMENTOS
            // ==========================================

            const items = document.querySelectorAll(".item");

            const slider =
                document.querySelector(".slider");

            const hoverSound =
                document.getElementById("hoverSound");

            const bgMusic =
                document.getElementById("bgMusic");

            const portalTransition =
                document.getElementById("portalTransition");


            // ==========================================
            // 🎴 INFORMAÇÕES DAS CARTAS
            // ==========================================

            const tarotInfo = {

                diva: {
                    number: "I",
                    name: "A ILUSIONISTA",
                    symbols: ["🌀", "✦", "🌀", "✦"],
                    runes: ["ᚠ", "ᚢ", "ᚦ", "ᚨ"]
                },

                siria: {
                    number: "VII",
                    name: "A FORTUNA",
                    symbols: ["🌳", "💰", "🌳", "💰"],
                    runes: ["ᚱ", "ᚲ", "ᚷ", "ᚹ"]
                },

                astreia: {
                    number: "XII",
                    name: "A PROTETORA",
                    symbols: ["🛡️", "⚔️", "🛡️", "⚔️"],
                    runes: ["ᚺ", "ᚾ", "ᛁ", "ᛃ"]
                },

                merlim: {
                    number: "V",
                    name: "A FEITICEIRA",
                    symbols: ["⚗️", "🔮", "⚗️", "🔮"],
                    runes: ["ᛈ", "ᛇ", "ᛉ", "ᛊ"]
                },

                umbra: {
                    number: "XIII",
                    name: "A CAÇADORA",
                    symbols: ["🗡️", "🎯", "🗡️", "🎯"],
                    runes: ["ᛏ", "ᛒ", "ᛖ", "ᛗ"]
                },

                atena: {
                    number: "III",
                    name: "A MESTRA",
                    symbols: ["📚", "🦉", "📚", "🦉"],
                    runes: ["ᛚ", "ᛝ", "ᛟ", "ᛞ"]
                },

                victoria: {
                    number: "VI",
                    name: "A GENERAL",
                    symbols: ["⚔️", "🏛️", "⚔️", "🏛️"],
                    runes: ["ᚪ", "ᚫ", "ᚣ", "ᛡ"]
                },

                hestia: {
                    number: "XV",
                    name: "A ORÁCULO",
                    symbols: ["🔮", "👁️", "🔮", "👁️"],
                    runes: ["ᛠ", "ᛢ", "ᛣ", "ᛤ"]
                },

                daedala: {
                    number: "IV",
                    name: "A INVENTORA",
                    symbols: ["⚙️", "🔧", "⚙️", "🔧"],
                    runes: ["ᛥ", "ᛦ", "ᛧ", "ᛨ"]
                }

            };


            // ==========================================
            // 🧬 MAPA DOS MODELOS
            //
            // IMPORTANTE:
            // Aqui cada carta aponta para APENAS
            // o modelo da própria Asura.
            // ==========================================

            const modeloMap = {

                diva: "diva2",

                siria: "siria",

                merlim: "merlim",

                astreia: "astreia",

                umbra: "umbra",

                atena: "atena",

                victoria: "victoria2",

                hestia: "hestia2",

                daedala: "daedala"

            };


            // ==========================================
            // 🌐 GERAR URL DO MODELO
            // ==========================================

            function getModelURL(asura) {

                const nomeArquivo =
                    modeloMap[asura] || asura;

                return (
                    "/world_azure/models/" +
                    nomeArquivo +
                    ".glb"
                );

            }


            // ==========================================
            // 🚀 PREPARAR MODELO DA ASURA
            //
            // NÃO ESPERA.
            //
            // O objetivo é apenas avisar ao sistema:
            //
            // "Comece a baixar este GLB agora."
            //
            // ==========================================

            function prepararModeloAsura(asura) {

                const modelURL =
                    getModelURL(asura);


                console.log(
                    "🌌 Iniciando preparação dimensional:",
                    asura
                );

                console.log(
                    "📦 Modelo:",
                    modelURL
                );


                // ======================================
                // 1. PRELOAD
                // ======================================

                const preload =
                    document.createElement("link");

                preload.rel = "preload";

                preload.as = "fetch";

                preload.href = modelURL;

                preload.crossOrigin = "anonymous";

                document.head.appendChild(preload);


                // ======================================
                // 2. SERVICE WORKER
                //
                // O SW é o responsável por manter
                // o download/cache mesmo quando esta
                // página for abandonada.
                // ======================================

                if (
                    "serviceWorker" in navigator &&
                    navigator.serviceWorker.controller
                ) {

                    try {

                        navigator.serviceWorker.controller.postMessage({

                            type: "PRELOAD_ASURA_MODEL",

                            url: modelURL,

                            asura: asura

                        });

                        console.log(
                            "🌀 Download entregue ao Service Worker:",
                            asura
                        );

                    } catch (error) {

                        console.warn(
                            "⚠️ Não foi possível enviar ao Service Worker:",
                            error
                        );

                    }

                } else {

                    /*
                     * Fallback.
                     *
                     * Se o Service Worker ainda não estiver
                     * controlando esta página, fazemos um fetch
                     * normal.
                     *
                     * NÃO usamos await.
                     *
                     * A navegação continua imediatamente.
                     */

                    fetch(
                        modelURL,
                        {
                            method: "GET",
                            cache: "force-cache",
                            credentials: "same-origin"
                        }
                    )
                    .then(() => {

                        console.log(
                            "📦 Modelo começou a ser preparado:",
                            asura
                        );

                    })
                    .catch(error => {

                        console.warn(
                            "⚠️ Falha no pré-carregamento:",
                            error
                        );

                    });

                }


                // ======================================
                // 3. AVISA O PRÓXIMO MUNDO
                //
                // viagem.html poderá saber qual modelo
                // está sendo preparado.
                // ======================================

                try {

                    sessionStorage.setItem(
                        "asura_model_url",
                        modelURL
                    );

                    sessionStorage.setItem(
                        "asura_model_name",
                        asura
                    );

                    sessionStorage.setItem(
                        "asura_model_loading",
                        "true"
                    );

                    sessionStorage.setItem(
                        "asura_model_started_at",
                        String(Date.now())
                    );

                } catch (error) {

                    console.warn(
                        "⚠️ sessionStorage indisponível:",
                        error
                    );

                }

            }


            // ==========================================
            // 🎴 APLICAR ESTILO TAROT
            // ==========================================

            items.forEach(item => {

                const asura =
                    item.dataset.asura;

                const info =
                    tarotInfo[asura];


                if (info) {

                    item.classList.add(
                        "tarot-card"
                    );


                    const numberSpan =
                        document.createElement("span");

                    numberSpan.className =
                        "tarot-number";

                    numberSpan.textContent =
                        info.number;

                    item.appendChild(
                        numberSpan
                    );


                    const nameSpan =
                        document.createElement("span");

                    nameSpan.className =
                        "tarot-name";

                    nameSpan.textContent =
                        info.name;

                    item.appendChild(
                        nameSpan
                    );


                    const positions = [
                        "tl",
                        "tr",
                        "bl",
                        "br"
                    ];


                    info.symbols.forEach(
                        (sym, i) => {

                            const symSpan =
                                document.createElement("span");

                            symSpan.className =
                                "tarot-symbol " +
                                positions[i];

                            symSpan.textContent =
                                sym;

                            item.appendChild(
                                symSpan
                            );

                        }
                    );


                    const runePositions = [
                        "top",
                        "right",
                        "bottom",
                        "left"
                    ];


                    info.runes.forEach(
                        (rune, i) => {

                            const runeSpan =
                                document.createElement("span");

                            runeSpan.className =
                                "rune " +
                                runePositions[i];

                            runeSpan.textContent =
                                rune;

                            item.appendChild(
                                runeSpan
                            );

                        }
                    );


                    const holoLayer =
                        document.createElement("div");

                    holoLayer.className =
                        "holo-layer";

                    item.appendChild(
                        holoLayer
                    );

                }


                item.style.setProperty(
                    "--glow-color",
                    item.dataset.color
                );

            });


            // ==========================================
            // 🔥 PARTÍCULAS DAS CARTAS
            // ==========================================

            function createCardParticles(item) {

                const container =
                    document.createElement("div");

                container.className =
                    "particle-container";

                item.appendChild(
                    container
                );


                setInterval(() => {

                    if (
                        item.classList.contains("fade-all") ||
                        item.classList.contains("active")
                    ) {
                        return;
                    }


                    if (
                        item.style.opacity === "0" ||
                        item.style.opacity === "0.08"
                    ) {
                        return;
                    }


                    const rect =
                        item.getBoundingClientRect();


                    if (
                        rect.width === 0 ||
                        rect.height === 0
                    ) {
                        return;
                    }


                    const centerX =
                        rect.width / 2;

                    const centerY =
                        rect.height / 2;


                    const count =
                        2 +
                        Math.floor(
                            Math.random() * 2
                        );


                    for (
                        let i = 0;
                        i < count;
                        i++
                    ) {

                        const particle =
                            document.createElement("div");

                        particle.className =
                            "particle";


                        const angle =
                            Math.random() *
                            Math.PI *
                            2;


                        const distance =
                            Math.random() *
                            30 +
                            10;


                        const startX =
                            centerX +
                            Math.cos(angle) *
                            distance -
                            2;


                        const startY =
                            centerY +
                            Math.sin(angle) *
                            distance -
                            2;


                        particle.style.left =
                            startX + "px";

                        particle.style.top =
                            startY + "px";


                        const dirAngle =
                            Math.random() *
                            Math.PI *
                            2;


                        const speed =
                            20 +
                            Math.random() *
                            40;


                        const tx =
                            Math.cos(dirAngle) *
                            speed;


                        const ty =
                            Math.sin(dirAngle) *
                            speed;


                        particle.style.setProperty(
                            "--tx",
                            tx + "px"
                        );

                        particle.style.setProperty(
                            "--ty",
                            ty + "px"
                        );


                        particle.style.setProperty(
                            "--glow-color",
                            item.dataset.color
                        );


                        const size =
                            3 +
                            Math.random() *
                            4;


                        particle.style.width =
                            size + "px";

                        particle.style.height =
                            size + "px";


                        particle.style.background =
                            item.dataset.color;


                        particle.style.boxShadow =
                            `0 0 ${size * 3}px ${item.dataset.color}`;


                        container.appendChild(
                            particle
                        );


                        setTimeout(() => {

                            particle.remove();

                        }, 2000);

                    }

                }, 300);

            }


            // ==========================================
            // DELAY DAS PARTÍCULAS
            // ==========================================

            setTimeout(() => {

                items.forEach(
                    createCardParticles
                );

            }, 2000);


            // ==========================================
            // 🔊 HOVER
            // ==========================================

            items.forEach(item => {

                item.addEventListener(
                    "mouseenter",
                    () => {

                        if (!hoverSound) {
                            return;
                        }


                        hoverSound.volume =
                            0.12;

                        hoverSound.currentTime =
                            0;

                        hoverSound
                            .play()
                            .catch(() => {});

                    }
                );

            });


            // ==========================================
            // ✨ PARTÍCULAS DE FUNDO
            // ==========================================

            const canvas =
                document.getElementById(
                    "particles"
                );

            const ctx =
                canvas.getContext("2d");


            function resizeCanvas() {

                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;

            }


            resizeCanvas();


            window.addEventListener(
                "resize",
                resizeCanvas
            );


            const particles = [];


            for (
                let i = 0;
                i < 120;
                i++
            ) {

                particles.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    size:
                        Math.random() *
                        2 +
                        1,

                    speedX:
                        (Math.random() - 0.5) *
                        0.3,

                    speedY:
                        (Math.random() - 0.5) *
                        0.3,

                    opacity:
                        Math.random() *
                        0.5

                });

            }


            function drawParticles() {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                particles.forEach(p => {

                    ctx.beginPath();


                    ctx.arc(
                        p.x,
                        p.y,
                        p.size,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `rgba(160, 80, 255, ${p.opacity})`;


                    ctx.fill();


                    p.x += p.speedX;
                    p.y += p.speedY;


                    if (
                        p.x < 0 ||
                        p.x > canvas.width
                    ) {
                        p.speedX *= -1;
                    }


                    if (
                        p.y < 0 ||
                        p.y > canvas.height
                    ) {
                        p.speedY *= -1;
                    }

                });


                requestAnimationFrame(
                    drawParticles
                );

            }


            drawParticles();


            // ==========================================
            // 🎵 MÚSICA
            // ==========================================

            if (bgMusic) {

                bgMusic.volume = 0;


                bgMusic
                    .play()
                    .then(() => {

                        setTimeout(() => {

                            bgMusic.volume =
                                0.12;

                        }, 800);

                    })
                    .catch(() => {

                        window.addEventListener(
                            "click",
                            () => {

                                bgMusic.volume =
                                    0.12;

                                bgMusic
                                    .play()
                                    .catch(() => {});

                            },
                            {
                                once: true
                            }
                        );


                        window.addEventListener(
                            "touchstart",
                            () => {

                                bgMusic.volume =
                                    0.12;

                                bgMusic
                                    .play()
                                    .catch(() => {});

                            },
                            {
                                once: true
                            }
                        );

                    });

            }


            // ==========================================
            // 🌌 TRANSIÇÃO
            // ==========================================

            let transitioning =
                false;


            function createPortalFlash(color) {

                const flash =
                    document.createElement(
                        "div"
                    );


                flash.className =
                    "portal-flash";


                flash.style.setProperty(
                    "--flash-color",
                    color
                );


                document.body.appendChild(
                    flash
                );


                requestAnimationFrame(
                    () => {

                        flash.classList.add(
                            "show"
                        );

                    }
                );


                setTimeout(() => {

                    flash.classList.remove(
                        "show"
                    );


                    setTimeout(() => {

                        flash.remove();

                    }, 1000);

                }, 900);

            }


            // ==========================================
            // 🚀 ENTRADA NA DIMENSÃO
            // ==========================================

            function startAsuraTransition(
                selectedItem,
                asura
            ) {

                if (transitioning) {
                    return;
                }


                transitioning = true;


                console.log(
                    "🌌 PORTAL ABERTO:",
                    asura
                );


                // ======================================
                // 🔥 PRIMEIRA COISA:
                //
                // COMEÇA O DOWNLOAD DO GLB.
                //
                // NÃO ESPERA.
                // ======================================

                prepararModeloAsura(
                    asura
                );


                // ======================================
                // PORTAL AUTH
                // ======================================

                if (
                    typeof PortalAuth !==
                    "undefined"
                ) {

                    try {

                        PortalAuth.generateToken(
                            asura
                        );

                    } catch (error) {

                        console.warn(
                            "PortalAuth:",
                            error
                        );

                    }

                }


                // ======================================
                // PAUSAR CARROSSEL
                // ======================================

                if (slider) {

                    slider.style.animationPlayState =
                        "paused";

                }


                // ======================================
                // SOM
                // ======================================

                if (hoverSound) {

                    hoverSound.volume =
                        0.2;

                    hoverSound.currentTime =
                        0;

                    hoverSound
                        .play()
                        .catch(() => {});

                }


                // ======================================
                // FADE DA MÚSICA
                // ======================================

                if (bgMusic) {

                    const fadeAudio =
                        setInterval(() => {

                            if (
                                bgMusic.volume >
                                0.02
                            ) {

                                bgMusic.volume -=
                                    0.01;

                            } else {

                                bgMusic.volume =
                                    0;

                                clearInterval(
                                    fadeAudio
                                );

                            }

                        }, 40);

                }


                // ======================================
                // EFEITOS VISUAIS
                // ======================================

                if (slider) {

                    slider.classList.add(
                        "fade-all"
                    );

                }


                selectedItem.classList.add(
                    "active"
                );


                document.body.style.transition =
                    "transform 1.6s ease";


                document.body.style.transform =
                    "scale(1.03)";


                if (portalTransition) {

                    portalTransition.classList.add(
                        "active"
                    );

                }


                createPortalFlash(
                    selectedItem.dataset.color
                );


                // ======================================
                // 🚪 NÃO ESPERA O GLB
                //
                // A viagem começa imediatamente.
                // ======================================

                setTimeout(() => {

                    window.location.href =
                        "/world_azure/viagem.html?asura=" +
                        encodeURIComponent(asura);

                }, 2200);

            }


            // ==========================================
            // 🔐 HÉCATE
            // ==========================================

            function liberarCartas() {

                items.forEach(item => {

                    item.style.pointerEvents =
                        "";

                    item.style.opacity =
                        "";

                    item.style.filter =
                        "";


                    item.addEventListener(
                        "click",
                        () => {

                            startAsuraTransition(
                                item,
                                item.dataset.asura
                            );

                        }
                    );

                });

            }


            if (
                localStorage.getItem(
                    "hecate_auth_complete"
                ) === "true"
            ) {

                liberarCartas();

            } else {

                items.forEach(item => {

                    item.style.pointerEvents =
                        "none";

                    item.style.opacity =
                        "0.4";

                    item.style.filter =
                        "blur(2px)";

                });


                let testeAtivo =
                    false;


                function ativarHecate() {

                    if (testeAtivo) {
                        return;
                    }


                    testeAtivo =
                        true;


                    document.body.removeEventListener(
                        "click",
                        ativarHecate
                    );


                    document.body.removeEventListener(
                        "touchstart",
                        ativarHecate
                    );


                    if (
                        typeof HecateTest !==
                        "undefined" &&
                        HecateTest.show
                    ) {

                        try {

                            HecateTest.show(
                                function(success) {

                                    if (success) {

                                        localStorage.setItem(
                                            "hecate_auth_complete",
                                            "true"
                                        );


                                        liberarCartas();

                                    } else {

                                        testeAtivo =
                                            false;


                                        document.body.addEventListener(
                                            "click",
                                            ativarHecate
                                        );


                                        document.body.addEventListener(
                                            "touchstart",
                                            ativarHecate
                                        );

                                    }

                                }
                            );

                        } catch (err) {

                            console.error(
                                "Erro Hécate:",
                                err
                            );


                            testeAtivo =
                                false;


                            document.body.addEventListener(
                                "click",
                                ativarHecate
                            );


                            document.body.addEventListener(
                                "touchstart",
                                ativarHecate
                            );

                        }

                    } else {

                        testeAtivo =
                            false;


                        document.body.addEventListener(
                            "click",
                            ativarHecate
                        );


                        document.body.addEventListener(
                            "touchstart",
                            ativarHecate
                        );
