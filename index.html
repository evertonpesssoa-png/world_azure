<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/world_azure/style.css">

    <title>ASURAS - Grimório Dimensional | Hécate Guardiã</title>

    <style>
        /* ============================================
           DEBUG VISUAL - MOSTRA TUDO NA TELA
           ============================================ */
        #debug-console {
            position: fixed !important;
            bottom: 10px !important;
            left: 10px !important;
            right: 10px !important;
            background: rgba(0, 0, 0, 0.95) !important;
            color: #0f0 !important;
            font-family: 'Courier New', monospace !important;
            font-size: 11px !important;
            padding: 10px !important;
            border-radius: 8px !important;
            max-height: 200px !important;
            overflow-y: auto !important;
            z-index: 9999999 !important;
            border: 2px solid #0f0 !important;
            pointer-events: auto !important;
            line-height: 1.6 !important;
            scrollbar-width: thin !important;
            scrollbar-color: #0f0 transparent !important;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2) !important;
        }

        #debug-console::-webkit-scrollbar {
            width: 4px !important;
        }
        #debug-console::-webkit-scrollbar-thumb {
            background: #0f0 !important;
            border-radius: 4px !important;
        }

        .debug-error { color: #ff4444 !important; text-shadow: 0 0 10px rgba(255,0,0,0.5) !important; }
        .debug-success { color: #44ff44 !important; text-shadow: 0 0 10px rgba(0,255,0,0.5) !important; }
        .debug-warn { color: #ffaa00 !important; text-shadow: 0 0 10px rgba(255,170,0,0.5) !important; }
        .debug-info { color: #44aaff !important; text-shadow: 0 0 10px rgba(68,170,255,0.5) !important; }

        #debug-title {
            color: #888 !important;
            border-bottom: 1px solid #333 !important;
            padding-bottom: 4px !important;
            margin-bottom: 4px !important;
            font-weight: bold !important;
        }

        #hecate-status-badge {
            position: fixed !important;
            top: 10px !important;
            right: 10px !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            font-size: 12px !important;
            font-weight: bold !important;
            z-index: 9999999 !important;
            font-family: 'Courier New', monospace !important;
            pointer-events: none !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            border: 2px solid !important;
            transition: all 0.3s !important;
            background: rgba(0, 0, 0, 0.9) !important;
        }

        #hecate-status-badge.locked {
            color: #ff4444 !important;
            border-color: #ff4444 !important;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3) !important;
        }

        #hecate-status-badge.unlocked {
            color: #44ff44 !important;
            border-color: #44ff44 !important;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3) !important;
        }

        #hecate-status-badge.testing {
            color: #ffaa00 !important;
            border-color: #ffaa00 !important;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.3) !important;
            animation: pulse-badge 1s ease-in-out infinite !important;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #copy-debug-btn {
            position: fixed !important;
            bottom: 220px !important;
            right: 10px !important;
            padding: 6px 12px !important;
            background: rgba(0,0,0,0.9) !important;
            color: #0f0 !important;
            border: 1px solid #0f0 !important;
            border-radius: 6px !important;
            font-size: 10px !important;
            z-index: 9999999 !important;
            cursor: pointer !important;
            font-family: 'Courier New', monospace !important;
            pointer-events: auto !important;
        }

        #copy-debug-btn:active {
            background: rgba(0,255,0,0.2) !important;
        }

        /* ============================================
           MAGO FORA DO SLIDER - 120%
           ============================================ */
        .banner .mago-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background-image: url(images/mago3.png);
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: contain;
            opacity: 0.95;
            z-index: 2;
            pointer-events: none;
        }
    </style>

</head>

<body>

    <!-- BADGE DE STATUS -->
    <div id="hecate-status-badge" class="locked">🔒 BLOQUEADO</div>

    <!-- BOTÃO COPIAR -->
    <button id="copy-debug-btn">📋 COPIAR</button>

    <!-- CONSOLE DE DEBUG -->
    <div id="debug-console">
        <div id="debug-title">🐞 DEBUG GRIMÓRIO</div>
        <div id="debug-log"></div>
    </div>

    <div class="banner">
        <canvas id="particles"></canvas>
        
        <!-- ⭐ MAGO FORA DO SLIDER (PARADO E GRANDE) ⭐ -->
        <div class="mago-center"></div>
        
        <div class="slider" style="--quantity: 9">
            <!-- CARTAS -->
            <div class="item" data-asura="diva" data-color="#ff4db8" style="--position: 1">
                <img src="/world_azure/images/diva2.png" alt="Diva" draggable="false">
            </div>
            <div class="item" data-asura="siria" data-color="#35ff9c" style="--position: 2">
                <img src="/world_azure/images/siria2.png" alt="Siria" draggable="false">
            </div>
            <div class="item" data-asura="merlim" data-color="#00d9ff" style="--position: 3">
                <img src="/world_azure/images/merlim2.png" alt="Merlim" draggable="false">
            </div>
            <div class="item" data-asura="astreia" data-color="#287bff" style="--position: 4">
                <img src="/world_azure/images/astreia2.png" alt="Astreia" draggable="false">
            </div>
            <div class="item" data-asura="umbra" data-color="#8b2fff" style="--position: 5">
                <img src="/world_azure/images/umbra2.png" alt="Umbra" draggable="false">
            </div>
            <div class="item" data-asura="atena" data-color="#ffd54f" style="--position: 6">
                <img src="/world_azure/images/atena2.png" alt="Atena" draggable="false">
            </div>
            <div class="item" data-asura="victoria" data-color="#ff4444" style="--position: 7">
                <img src="/world_azure/images/victoria2.png" alt="Victoria" draggable="false">
            </div>
            <div class="item" data-asura="hestia" data-color="#fff0b3" style="--position: 8">
                <img src="/world_azure/images/hestia2.png" alt="Hestia" draggable="false">
            </div>
            <div class="item" data-asura="daedala" data-color="#00ffd5" style="--position: 9">
                <img src="/world_azure/images/daedala2.png" alt="Daedala" draggable="false">
            </div>
        </div>
        <div class="content">
            <!-- REMOVIDO O .model DAQUI -->
        </div>
    </div>

    <div id="portalTransition" class="portal-flash"></div>

    <audio id="hoverSound" src="/world_azure/sounds/hover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="/world_azure/sounds/ambient.mp3" loop preload="auto" playsinline></audio>

    <!-- HÉCATE - SISTEMA COMPLETO -->
    <script src="/world_azure/shared/js/hecate/core.js"></script>
    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>
    <script src="/world_azure/shared/js/hecate/test-system.js"></script>
    <script src="/world_azure/shared/js/hecate/auth.js"></script>

    <!-- CÓDIGO PRINCIPAL COM DEBUG -->
    <script>
        (function() {
            // ============================================
            // 🐞 SISTEMA DE DEBUG VISUAL
            // ============================================
            const debugLog = document.getElementById('debug-log');
            const statusBadge = document.getElementById('hecate-status-badge');

            debugLog.innerHTML = '';

            function debug(msg, type = 'info') {
                const time = new Date().toLocaleTimeString();
                const colors = {
                    error: 'debug-error',
                    success: 'debug-success',
                    warn: 'debug-warn',
                    info: 'debug-info'
                };
                const prefix = {
                    error: '❌',
                    success: '✅',
                    warn: '⚠️',
                    info: 'ℹ️'
                };
                const entry = document.createElement('div');
                entry.className = colors[type] || 'debug-info';
                entry.textContent = `[${time}] ${prefix[type] || '•'} ${msg}`;
                debugLog.appendChild(entry);
                debugLog.scrollTop = debugLog.scrollHeight;
                console.log(`[DEBUG] ${msg}`);
            }

            function setStatus(text, type = 'locked') {
                statusBadge.textContent = text;
                statusBadge.className = type;
            }

            // ============================================
            // 📋 BOTÃO COPIAR
            // ============================================
            document.getElementById('copy-debug-btn').addEventListener('click', function() {
                const text = debugLog.innerText;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.textContent = '✅ COPIADO!';
                        setTimeout(() => this.textContent = '📋 COPIAR', 2000);
                    }).catch(() => {
                        this.textContent = '❌ ERRO';
                        setTimeout(() => this.textContent = '📋 COPIAR', 2000);
                    });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    this.textContent = '✅ COPIADO!';
                    setTimeout(() => this.textContent = '📋 COPIAR', 2000);
                }
            });

            // ============================================
            // CONFIGURAÇÃO INICIAL
            // ============================================
            debug('🚀 Inicializando Grimório...', 'info');

            const items = document.querySelectorAll(".item");
            const slider = document.querySelector(".slider");
            const hoverSound = document.getElementById("hoverSound");
            const bgMusic = document.getElementById("bgMusic");
            const portalTransition = document.getElementById("portalTransition");

            debug(`📦 Encontrados ${items.length} cards`, 'info');

            // Verificar se o mago existe
            const mago = document.querySelector('.mago-center');
            if (mago) {
                debug('✅ Mago encontrado no DOM', 'success');
                debug(`📐 Mago size: ${mago.offsetWidth}x${mago.offsetHeight}`, 'info');
            } else {
                debug('❌ Mago NÃO encontrado no DOM!', 'error');
            }

            // ============================================
            // 🎴 TAROT INFO
            // ============================================
            const tarotInfo = {
                'diva': { number: 'I', name: 'A ILUSIONISTA', symbols: ['🌀', '✦', '🌀', '✦'], runes: ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ'] },
                'siria': { number: 'VII', name: 'A FORTUNA', symbols: ['🌳', '💰', '🌳', '💰'], runes: ['ᚱ', 'ᚲ', 'ᚷ', 'ᚹ'] },
                'astreia': { number: 'XII', name: 'A PROTETORA', symbols: ['🛡️', '⚔️', '🛡️', '⚔️'], runes: ['ᚺ', 'ᚾ', 'ᛁ', 'ᛃ'] },
                'merlim': { number: 'V', name: 'A FEITICEIRA', symbols: ['⚗️', '🔮', '⚗️', '🔮'], runes: ['ᛈ', 'ᛇ', 'ᛉ', 'ᛊ'] },
                'umbra': { number: 'XIII', name: 'A CAÇADORA', symbols: ['🗡️', '🎯', '🗡️', '🎯'], runes: ['ᛏ', 'ᛒ', 'ᛖ', 'ᛗ'] },
                'atena': { number: 'III', name: 'A MESTRA', symbols: ['📚', '🦉', '📚', '🦉'], runes: ['ᛚ', 'ᛝ', 'ᛟ', 'ᛞ'] },
                'victoria': { number: 'VI', name: 'A GENERAL', symbols: ['⚔️', '🏛️', '⚔️', '🏛️'], runes: ['ᚪ', 'ᚫ', 'ᚣ', 'ᛡ'] },
                'hestia': { number: 'XV', name: 'A ORÁCULO', symbols: ['🔮', '👁️', '🔮', '👁️'], runes: ['ᛠ', 'ᛢ', 'ᛣ', 'ᛤ'] },
                'daedala': { number: 'IV', name: 'A INVENTORA', symbols: ['⚙️', '🔧', '⚙️', '🔧'], runes: ['ᛥ', 'ᛦ', 'ᛧ', 'ᛨ'] }
            };

            // ============================================
            // 🎴 APLICAR TAROT
            // ============================================
            debug('🎴 Aplicando estilo Tarot...', 'info');

            items.forEach(item => {
                const asura = item.dataset.asura;
                const info = tarotInfo[asura];

                if (info) {
                    item.classList.add('tarot-card');

                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'tarot-number';
                    numberSpan.textContent = info.number;
                    item.appendChild(numberSpan);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'tarot-name';
                    nameSpan.textContent = info.name;
                    item.appendChild(nameSpan);

                    const positions = ['tl', 'tr', 'bl', 'br'];
                    info.symbols.forEach((sym, i) => {
                        const symSpan = document.createElement('span');
                        symSpan.className = `tarot-symbol ${positions[i]}`;
                        symSpan.textContent = sym;
                        item.appendChild(symSpan);
                    });

                    const runePositions = ['top', 'right', 'bottom', 'left'];
                    info.runes.forEach((rune, i) => {
                        const runeSpan = document.createElement('span');
                        runeSpan.className = `rune ${runePositions[i]}`;
                        runeSpan.textContent = rune;
                        item.appendChild(runeSpan);
                    });

                    const holoLayer = document.createElement('div');
                    holoLayer.className = 'holo-layer';
                    item.appendChild(holoLayer);
                }

                item.style.setProperty("--glow-color", item.dataset.color);
            });

            debug('✅ Estilo Tarot aplicado', 'success');

            // ============================================
            // 🔊 SOM HOVER
            // ============================================
            items.forEach(item => {
                item.addEventListener("mouseenter", () => {
                    if (hoverSound) {
                        hoverSound.volume = 0.12;
                        hoverSound.currentTime = 0;
                        hoverSound.play().catch(() => {});
                    }
                });
            });

            // ============================================
            // ✨ PARTÍCULAS BACKGROUND - ROXAS
            // ============================================
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            const particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(160, 80, 255, ${p.opacity})`;
                    ctx.fill();
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                });
                requestAnimationFrame(drawParticles);
            }
            drawParticles();
            debug('✅ Partículas de fundo ROXAS ativadas', 'success');

            // ============================================
            // 🎵 MÚSICA
            // ============================================
            if (bgMusic) {
                bgMusic.volume = 0;
                bgMusic.play().then(() => {
                    setTimeout(() => bgMusic.volume = 0.12, 800);
                }).catch(() => {
                    window.addEventListener("click", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                    window.addEventListener("touchstart", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                });
            }

            // ============================================
            // 🌌 TRANSIÇÃO PORTAL
            // ============================================
            let transitioning = false;

            function createPortalFlash(color) {
                const flash = document.createElement("div");
                flash.className = "portal-flash";
                flash.style.setProperty("--flash-color", color);
                document.body.appendChild(flash);
                requestAnimationFrame(() => flash.classList.add("show"));
                setTimeout(() => {
                    flash.classList.remove("show");
                    setTimeout(() => flash.remove(), 1000);
                }, 900);
            }

            function startAsuraTransition(selectedItem, asura) {
                if (transitioning) return;
                transitioning = true;

                if (typeof PortalAuth !== 'undefined') {
                    PortalAuth.generateToken(asura);
                }

                if (slider) slider.style.animationPlayState = "paused";
                if (hoverSound) {
                    hoverSound.volume = 0.2;
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(() => {});
                }
                if (bgMusic) {
                    const fadeAudio = setInterval(() => {
                        if (bgMusic.volume > 0.02) {
                            bgMusic.volume -= 0.01;
                        } else {
                            bgMusic.volume = 0;
                            clearInterval(fadeAudio);
                        }
                    }, 40);
                }
                if (slider) slider.classList.add("fade-all");
                selectedItem.classList.add("active");
                document.body.style.transition = "transform 1.6s ease";
                document.body.style.transform = "scale(1.03)";
                if (portalTransition) portalTransition.classList.add("active");
                createPortalFlash(selectedItem.dataset.color);

                setTimeout(() => {
                    window.location.href = "/world_azure/viagem.html?asura=" + asura;
                }, 2200);
            }

            // ============================================
            // 🔥 HÉCATE
            // ============================================
            debug('🔍 Verificando HecateTest: ' + typeof HecateTest, 'info');

            if (localStorage.getItem('hecate_auth_complete') === 'true') {
                debug('✅ Usuário já autenticado', 'success');
                setStatus('🔓 LIBERADO', 'unlocked');
                items.forEach(item => {
                    item.style.pointerEvents = "";
                    item.style.opacity = "";
                    item.style.filter = "";
                    item.addEventListener("click", () => {
                        startAsuraTransition(item, item.dataset.asura);
                    });
                });
            } else {
                debug('🔒 Usuário NÃO autenticado', 'warn');
                setStatus('🔒 BLOQUEADO', 'locked');

                items.forEach(item => {
                    item.style.pointerEvents = "none";
                    item.style.opacity = "0.4";
                    item.style.filter = "blur(2px)";
                    item.removeEventListener('click', startAsuraTransition);
                });

                let testeAtivo = false;

                function ativarHecate() {
                    if (testeAtivo) return;
                    testeAtivo = true;

                    debug('🔥 Ativando Hécate...', 'info');
                    setStatus('🧪 TESTANDO...', 'testing');

                    document.body.removeEventListener('click', ativarHecate);
                    document.body.removeEventListener('touchstart', ativarHecate);

                    if (typeof HecateTest !== 'undefined' && HecateTest.show) {
                        debug('✅ HecateTest encontrado!', 'success');
                        try {
                            HecateTest.show(function(success) {
                                debug('📝 Resultado: ' + success, success ? 'success' : 'error');
                                if (success) {
                                    debug('✅ APROVADO! Liberando cards...', 'success');
                                    setStatus('🔓 LIBERADO', 'unlocked');
                                    localStorage.setItem('hecate_auth_complete', 'true');

                                    items.forEach(item => {
                                        item.style.pointerEvents = "";
                                        item.style.opacity = "";
                                        item.style.filter = "";
                                        item.addEventListener("click", () => {
                                            startAsuraTransition(item, item.dataset.asura);
                                        });
                                    });
                                } else {
                                    debug('❌ REPROVADO!', 'error');
                                    setStatus('🔒 BLOQUEADO', 'locked');
                                    testeAtivo = false;
                                    document.body.addEventListener('click', ativarHecate);
                                    document.body.addEventListener('touchstart', ativarHecate);
                                }
                            });
                        } catch (err) {
                            debug('❌ ERRO: ' + err.message, 'error');
                            setStatus('🔒 ERRO', 'locked');
                            testeAtivo = false;
                            document.body.addEventListener('click', ativarHecate);
                            document.body.addEventListener('touchstart', ativarHecate);
                        }
                    } else {
                        debug('❌ HecateTest NÃO encontrado!', 'error');
                        setStatus('🔒 ERRO', 'locked');
                        testeAtivo = false;
                        document.body.addEventListener('click', ativarHecate);
                        document.body.addEventListener('touchstart', ativarHecate);
                    }
                }

                document.body.addEventListener('click', ativarHecate);
                document.body.addEventListener('touchstart', ativarHecate);
                debug('🗝️ Toque na tela para ativar a Hécate', 'info');
            }

            debug('✅ Grimório inicializado!', 'success');
            debug('📱 Toque no DEBUG e copie com o botão 📋 COPIAR', 'info');

        })();
    </script>

</body>

</html>
