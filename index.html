<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/world_azure/style.css">

    <title>ASURAS - Grimório Dimensional | Hécate Guardiã</title>

    <style>
        /* ============================================
           DEBUG VISUAL - MOSTRA ERROS NA TELA
           ============================================ */
        #debug-console {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 999999;
            border: 1px solid rgba(0, 255, 0, 0.3);
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
            line-height: 1.6;
            scrollbar-width: thin;
            scrollbar-color: #0f0 transparent;
        }

        #debug-console::-webkit-scrollbar {
            width: 4px;
        }

        #debug-console::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 4px;
        }

        .debug-error {
            color: #ff4444 !important;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5) !important;
        }

        .debug-success {
            color: #44ff44 !important;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5) !important;
        }

        .debug-warn {
            color: #ffaa00 !important;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5) !important;
        }

        .debug-info {
            color: #44aaff !important;
            text-shadow: 0 0 10px rgba(68, 170, 255, 0.5) !important;
        }

        /* Indicador de status da Hécate */
        #hecate-status-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 999999;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid;
            transition: all 0.3s;
        }

        #hecate-status-badge.locked {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }

        #hecate-status-badge.unlocked {
            background: rgba(0, 255, 0, 0.2);
            color: #44ff44;
            border-color: #44ff44;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #hecate-status-badge.testing {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
            animation: pulse-badge 1s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

</head>

<body>

    <!-- BADGE DE STATUS DA HÉCATE -->
    <div id="hecate-status-badge" class="locked">🔒 BLOQUEADO</div>

    <!-- CONSOLE DE DEBUG VISUAL -->
    <div id="debug-console">
        <div style="color:#888; border-bottom:1px solid #333; padding-bottom:4px; margin-bottom:4px;">
            🐞 DEBUG HÉCATE
        </div>
        <div id="debug-log"></div>
    </div>

    <div class="banner">
        <canvas id="particles"></canvas>
        <div class="slider" style="--quantity: 9">
            <div class="item" data-asura="diva" data-color="#ff4db8" style="--position: 1">
                <img src="/world_azure/images/diva2.png" alt="Diva" draggable="false">
            </div>
            <div class="item" data-asura="siria" data-color="#35ff9c" style="--position: 2">
                <img src="/world_azure/images/siria2.png" alt="Siria" draggable="false">
            </div>
            <div class="item" data-asura="merlim" data-color="#00d9ff" style="--position: 3">
                <img src="/world_azure/images/merlim2.png" alt="Merlim" draggable="false">
            </div>
            <div class="item" data-asura="astreia" data-color="#287bff" style="--position: 4">
                <img src="/world_azure/images/astreia2.png" alt="Astreia" draggable="false">
            </div>
            <div class="item" data-asura="umbra" data-color="#8b2fff" style="--position: 5">
                <img src="/world_azure/images/umbra2.png" alt="Umbra" draggable="false">
            </div>
            <div class="item" data-asura="atena" data-color="#ffd54f" style="--position: 6">
                <img src="/world_azure/images/atena2.png" alt="Atena" draggable="false">
            </div>
            <div class="item" data-asura="victoria" data-color="#ff4444" style="--position: 7">
                <img src="/world_azure/images/victoria2.png" alt="Victoria" draggable="false">
            </div>
            <div class="item" data-asura="hestia" data-color="#fff0b3" style="--position: 8">
                <img src="/world_azure/images/hestia2.png" alt="Hestia" draggable="false">
            </div>
            <div class="item" data-asura="daedala" data-color="#00ffd5" style="--position: 9">
                <img src="/world_azure/images/daedala2.png" alt="Daedala" draggable="false">
            </div>
        </div>
        <div class="content">
            <div class="model"></div>
        </div>
    </div>

    <div id="portalTransition" class="portal-flash"></div>

    <audio id="hoverSound" src="/world_azure/sounds/hover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="/world_azure/sounds/ambient.mp3" loop preload="auto" playsinline></audio>

    <!-- HÉCATE - SISTEMA COMPLETO -->
    <script src="/world_azure/shared/js/hecate/core.js"></script>
    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>
    <script src="/world_azure/shared/js/hecate/test-system.js"></script>
    <script src="/world_azure/shared/js/hecate/auth.js"></script>

    <!-- CÓDIGO PRINCIPAL DO GRIMÓRIO COM TAROT + DEBUG -->
    <script>
        (function() {
            // ============================================
            // 🐞 SISTEMA DE DEBUG VISUAL
            // ============================================
            const debugLog = document.getElementById('debug-log');
            const statusBadge = document.getElementById('hecate-status-badge');

            function debug(msg, type = 'info') {
                const time = new Date().toLocaleTimeString();
                const colors = {
                    error: 'debug-error',
                    success: 'debug-success',
                    warn: 'debug-warn',
                    info: 'debug-info'
                };
                const prefix = {
                    error: '❌',
                    success: '✅',
                    warn: '⚠️',
                    info: 'ℹ️'
                };
                const entry = document.createElement('div');
                entry.className = colors[type] || 'debug-info';
                entry.textContent = `[${time}] ${prefix[type] || '•'} ${msg}`;
                debugLog.appendChild(entry);
                debugLog.scrollTop = debugLog.scrollHeight;

                // Também loga no console
                console.log(`[DEBUG] ${msg}`);
            }

            function setStatus(text, type = 'locked') {
                statusBadge.textContent = text;
                statusBadge.className = type;
            }

            // Limpar debug anterior
            debugLog.innerHTML = '';

            // ============================================
            // CONFIGURAÇÃO INICIAL
            // ============================================
            debug('🚀 Inicializando Grimório...', 'info');

            const items = document.querySelectorAll(".item");
            const slider = document.querySelector(".slider");
            const hoverSound = document.getElementById("hoverSound");
            const bgMusic = document.getElementById("bgMusic");
            const portalTransition = document.getElementById("portalTransition");

            debug(`📦 Encontrados ${items.length} cards`, 'info');

            // ============================================
            // 🎴 INFORMAÇÕES DAS CARTAS DE TAROT
            // ============================================

            const tarotInfo = {
                'diva': {
                    number: 'I',
                    name: 'A ILUSIONISTA',
                    symbols: ['🌀', '✦', '🌀', '✦'],
                    runes: ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ']
                },
                'siria': {
                    number: 'VII',
                    name: 'A FORTUNA',
                    symbols: ['🌳', '💰', '🌳', '💰'],
                    runes: ['ᚱ', 'ᚲ', 'ᚷ', 'ᚹ']
                },
                'astreia': {
                    number: 'XII',
                    name: 'A PROTETORA',
                    symbols: ['🛡️', '⚔️', '🛡️', '⚔️'],
                    runes: ['ᚺ', 'ᚾ', 'ᛁ', 'ᛃ']
                },
                'merlim': {
                    number: 'V',
                    name: 'A FEITICEIRA',
                    symbols: ['⚗️', '🔮', '⚗️', '🔮'],
                    runes: ['ᛈ', 'ᛇ', 'ᛉ', 'ᛊ']
                },
                'umbra': {
                    number: 'XIII',
                    name: 'A CAÇADORA',
                    symbols: ['🗡️', '🎯', '🗡️', '🎯'],
                    runes: ['ᛏ', 'ᛒ', 'ᛖ', 'ᛗ']
                },
                'atena': {
                    number: 'III',
                    name: 'A MESTRA',
                    symbols: ['📚', '🦉', '📚', '🦉'],
                    runes: ['ᛚ', 'ᛝ', 'ᛟ', 'ᛞ']
                },
                'victoria': {
                    number: 'VI',
                    name: 'A GENERAL',
                    symbols: ['⚔️', '🏛️', '⚔️', '🏛️'],
                    runes: ['ᚪ', 'ᚫ', 'ᚣ', 'ᛡ']
                },
                'hestia': {
                    number: 'XV',
                    name: 'A ORÁCULO',
                    symbols: ['🔮', '👁️', '🔮', '👁️'],
                    runes: ['ᛠ', 'ᛢ', 'ᛣ', 'ᛤ']
                },
                'daedala': {
                    number: 'IV',
                    name: 'A INVENTORA',
                    symbols: ['⚙️', '🔧', '⚙️', '🔧'],
                    runes: ['ᛥ', 'ᛦ', 'ᛧ', 'ᛨ']
                }
            };

            // ============================================
            // 🎴 APLICAR ESTILO TAROT NOS CARDS
            // ============================================

            debug('🎴 Aplicando estilo Tarot...', 'info');

            items.forEach(item => {
                const asura = item.dataset.asura;
                const info = tarotInfo[asura];

                if (info) {
                    item.classList.add('tarot-card');

                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'tarot-number';
                    numberSpan.textContent = info.number;
                    item.appendChild(numberSpan);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'tarot-name';
                    nameSpan.textContent = info.name;
                    item.appendChild(nameSpan);

                    const positions = ['tl', 'tr', 'bl', 'br'];
                    info.symbols.forEach((sym, i) => {
                        const symSpan = document.createElement('span');
                        symSpan.className = `tarot-symbol ${positions[i]}`;
                        symSpan.textContent = sym;
                        item.appendChild(symSpan);
                    });

                    const runePositions = ['top', 'right', 'bottom', 'left'];
                    info.runes.forEach((rune, i) => {
                        const runeSpan = document.createElement('span');
                        runeSpan.className = `rune ${runePositions[i]}`;
                        runeSpan.textContent = rune;
                        item.appendChild(runeSpan);
                    });

                    const holoLayer = document.createElement('div');
                    holoLayer.className = 'holo-layer';
                    item.appendChild(holoLayer);
                }

                item.style.setProperty("--glow-color", item.dataset.color);
            });

            debug('✅ Estilo Tarot aplicado', 'success');

            // ============================================
            // 🔊 SOM HOVER
            // ============================================

            items.forEach(item => {
                item.addEventListener("mouseenter", () => {
                    if (hoverSound) {
                        hoverSound.volume = 0.12;
                        hoverSound.currentTime = 0;
                        hoverSound.play().catch(() => {});
                    }
                });
            });

            // ============================================
            // ✨ PARTÍCULAS BACKGROUND
            // ============================================

            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            const particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
                    ctx.fill();
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                });
                requestAnimationFrame(drawParticles);
            }
            drawParticles();

            // ============================================
            // 🎵 MÚSICA AMBIENTE
            // ============================================

            if (bgMusic) {
                bgMusic.volume = 0;
                bgMusic.play().then(() => {
                    setTimeout(() => bgMusic.volume = 0.12, 800);
                }).catch(() => {
                    window.addEventListener("click", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                    window.addEventListener("touchstart", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                });
            }

            // ============================================
            // 🌌 TRANSIÇÃO PORTAL
            // ============================================

            let transitioning = false;

            function createPortalFlash(color) {
                const flash = document.createElement("div");
                flash.className = "portal-flash";
                flash.style.setProperty("--flash-color", color);
                document.body.appendChild(flash);
                requestAnimationFrame(() => flash.classList.add("show"));
                setTimeout(() => {
                    flash.classList.remove("show");
                    setTimeout(() => flash.remove(), 1000);
                }, 900);
            }

            function startAsuraTransition(selectedItem, asura) {
                if (transitioning) return;
                transitioning = true;

                if (typeof PortalAuth !== 'undefined') {
                    PortalAuth.generateToken(asura);
                }

                if (slider) slider.style.animationPlayState = "paused";
                if (hoverSound) {
                    hoverSound.volume = 0.2;
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(() => {});
                }
                if (bgMusic) {
                    const fadeAudio = setInterval(() => {
                        if (bgMusic.volume > 0.02) {
                            bgMusic.volume -= 0.01;
                        } else {
                            bgMusic.volume = 0;
                            clearInterval(fadeAudio);
                        }
                    }, 40);
                }
                if (slider) slider.classList.add("fade-all");
                selectedItem.classList.add("active");
                document.body.style.transition = "transform 1.6s ease";
                document.body.style.transform = "scale(1.03)";
                if (portalTransition) portalTransition.classList.add("active");
                createPortalFlash(selectedItem.dataset.color);

                setTimeout(() => {
                    window.location.href = "/world_azure/viagem.html?asura=" + asura;
                }, 2200);
            }

            // ============================================
            // 🔥 HÉCATE - SISTEMA DE BLOQUEIO E TESTE
            // ============================================

            // Verificar HecateTest
            debug(`🔍 Verificando HecateTest: ${typeof HecateTest}`, 'info');
            debug(`🔍 Verificando HecateBlock: ${typeof HecateBlock}`, 'info');
            debug(`🔍 Verificando PortalAuth: ${typeof PortalAuth}`, 'info');

            // Verificar se já passou no teste
            const authComplete = localStorage.getItem('hecate_auth_complete') === 'true';
            debug(`📋 localStorage hecate_auth_complete: ${authComplete}`, 'info');

            if (authComplete) {
                debug('✅ Usuário já autenticado!', 'success');
                setStatus('🔓 LIBERADO', 'unlocked');

                items.forEach(item => {
                    item.addEventListener("click", () => {
                        startAsuraTransition(item, item.dataset.asura);
                    });
                });
            } else {
                debug('🔒 Usuário NÃO autenticado - Bloqueando cards', 'warn');
                setStatus('🔒 BLOQUEADO', 'locked');

                // Bloquear cards
                items.forEach(item => {
                    item.style.pointerEvents = "none";
                    item.style.opacity = "0.4";
                    item.style.filter = "blur(2px)";
                });

                let testeAtivo = false;

                function ativarHecate() {
                    if (testeAtivo) return;
                    testeAtivo = true;

                    debug('🔥 Ativando Hécate...', 'info');
                    setStatus('🧪 TESTANDO...', 'testing');

                    document.body.removeEventListener('click', ativarHecate);
                    document.body.removeEventListener('touchstart', ativarHecate);

                    if (typeof HecateTest !== 'undefined' && HecateTest.show) {
                        debug('✅ HecateTest encontrado! Executando teste...', 'success');

                        try {
                            HecateTest.show(function(success) {
                                debug(`📝 Resultado do teste: ${success}`, success ? 'success' :
                                    'error');

                                if (success) {
                                    debug('✅ Teste aprovado! Liberando cards...', 'success');
                                    setStatus('🔓 LIBERADO', 'unlocked');
                                    localStorage.setItem('hecate_auth_complete', 'true');

                                    items.forEach(item => {
                                        item.style.pointerEvents = "";
                                        item.style.opacity = "";
                                        item.style.filter = "";
                                        item.addEventListener("click", () => {
                                            startAsuraTransition(item, item
                                            .dataset.asura);
                                        });
                                    });
                                } else {
                                    debug('❌ Teste falhou!', 'error');
                                    setStatus('🔒 BLOQUEADO', 'locked');
                                    testeAtivo = false;
                                    document.body.addEventListener('click', ativarHecate);
                                    document.body.addEventListener('touchstart', ativarHecate);
                                }
                            });
                        } catch (err) {
                            debug(`❌ ERRO no HecateTest.show: ${err.message}`, 'error');
                            setStatus('🔒 ERRO', 'locked');
                            testeAtivo = false;
                            document.body.addEventListener('click', ativarHecate);
                            document.body.addEventListener('touchstart', ativarHecate);
                        }
                    } else {
                        debug('❌ HecateTest NÃO encontrado!', 'error');
                        debug(`📋 HecateTest é: ${typeof HecateTest}`, 'error');
                        setStatus('🔒 ERRO', 'locked');

                        // Tentar carregar novamente após 2 segundos
                        debug('🔄 Tentando recarregar Hécate em 2 segundos...', 'warn');
                        setTimeout(() => {
                            debug('🔍 Verificando HecateTest novamente...', 'info');
                            debug(`📋 HecateTest: ${typeof HecateTest}`, 'info');

                            if (typeof HecateTest !== 'undefined' && HecateTest.show) {
                                debug('✅ HecateTest carregou! Tentando novamente...', 'success');
                                testeAtivo = false;
                                document.body.addEventListener('click', ativarHecate);
                                document.body.addEventListener('touchstart', ativarHecate);
                            } else {
                                debug('❌ HecateTest ainda não disponível', 'error');
                                debug('💡 Verifique se os arquivos estão no caminho correto:', 'warn');
                                debug('📁 /world_azure/shared/js/hecate/test-system.js', 'warn');
                                setStatus('🔒 ERRO', 'locked');
                            }
                        }, 2000);
                    }
                }

                document.body.addEventListener('click', ativarHecate);
                document.body.addEventListener('touchstart', ativarHecate);
                debug('🗝️ Toque na tela para ativar o teste da Hécate', 'info');
            }

        })();
    </script>

</body>

</html>
