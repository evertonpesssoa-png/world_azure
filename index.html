<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/world_azure/style.css">

    <title>ASURAS - Grimório Dimensional | Hécate Guardiã</title>

</head>

<body>

    <div class="banner">
        <canvas id="particles"></canvas>
        <div class="slider" style="--quantity: 9">
            <div class="item" data-asura="diva" data-color="#ff4db8" style="--position: 1">
                <img src="/world_azure/images/diva2.png" alt="Diva" draggable="false">
            </div>
            <div class="item" data-asura="siria" data-color="#35ff9c" style="--position: 2">
                <img src="/world_azure/images/siria2.png" alt="Siria" draggable="false">
            </div>
            <div class="item" data-asura="merlim" data-color="#00d9ff" style="--position: 3">
                <img src="/world_azure/images/merlim2.png" alt="Merlim" draggable="false">
            </div>
            <div class="item" data-asura="astreia" data-color="#287bff" style="--position: 4">
                <img src="/world_azure/images/astreia2.png" alt="Astreia" draggable="false">
            </div>
            <div class="item" data-asura="umbra" data-color="#8b2fff" style="--position: 5">
                <img src="/world_azure/images/umbra2.png" alt="Umbra" draggable="false">
            </div>
            <div class="item" data-asura="atena" data-color="#ffd54f" style="--position: 6">
                <img src="/world_azure/images/atena2.png" alt="Atena" draggable="false">
            </div>
            <div class="item" data-asura="victoria" data-color="#ff4444" style="--position: 7">
                <img src="/world_azure/images/victoria2.png" alt="Victoria" draggable="false">
            </div>
            <div class="item" data-asura="hestia" data-color="#fff0b3" style="--position: 8">
                <img src="/world_azure/images/hestia2.png" alt="Hestia" draggable="false">
            </div>
            <div class="item" data-asura="daedala" data-color="#00ffd5" style="--position: 9">
                <img src="/world_azure/images/daedala2.png" alt="Daedala" draggable="false">
            </div>
        </div>
        <div class="content">
            <div class="model"></div>
        </div>
    </div>

    <div id="portalTransition" class="portal-flash"></div>

    <audio id="hoverSound" src="/world_azure/sounds/hover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="/world_azure/sounds/ambient.mp3" loop preload="auto" playsinline></audio>

    <!-- HÉCATE - SISTEMA COMPLETO -->
    <script src="/world_azure/shared/js/hecate/core.js"></script>
    <script src="/world_azure/shared/js/hecate/block-manager.js"></script>
    <script src="/world_azure/shared/js/hecate/test-system.js"></script>
    <script src="/world_azure/shared/js/hecate/auth.js"></script>

    <!-- VERIFICAÇÃO DE HÉCATE -->
    <script>
        console.log('🔍 VERIFICANDO HÉCATE...');
        console.log('HecateTest:', typeof HecateTest);
        console.log('HecateBlock:', typeof HecateBlock);
        console.log('PortalAuth:', typeof PortalAuth);
        console.log('localStorage hecate_auth_complete:', localStorage.getItem('hecate_auth_complete'));
    </script>

    <!-- CÓDIGO PRINCIPAL DO GRIMÓRIO COM TAROT -->
    <script>
        (function() {
            const items = document.querySelectorAll(".item");
            const slider = document.querySelector(".slider");
            const hoverSound = document.getElementById("hoverSound");
            const bgMusic = document.getElementById("bgMusic");
            const portalTransition = document.getElementById("portalTransition");

            // ============================================
            // 🎴 INFORMAÇÕES DAS CARTAS DE TAROT
            // ============================================

            const tarotInfo = {
                'diva': {
                    number: 'I',
                    name: 'A ILUSIONISTA',
                    symbols: ['🌀', '✦', '🌀', '✦'],
                    runes: ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ']
                },
                'siria': {
                    number: 'VII',
                    name: 'A FORTUNA',
                    symbols: ['🌳', '💰', '🌳', '💰'],
                    runes: ['ᚱ', 'ᚲ', 'ᚷ', 'ᚹ']
                },
                'astreia': {
                    number: 'XII',
                    name: 'A PROTETORA',
                    symbols: ['🛡️', '⚔️', '🛡️', '⚔️'],
                    runes: ['ᚺ', 'ᚾ', 'ᛁ', 'ᛃ']
                },
                'merlim': {
                    number: 'V',
                    name: 'A FEITICEIRA',
                    symbols: ['⚗️', '🔮', '⚗️', '🔮'],
                    runes: ['ᛈ', 'ᛇ', 'ᛉ', 'ᛊ']
                },
                'umbra': {
                    number: 'XIII',
                    name: 'A CAÇADORA',
                    symbols: ['🗡️', '🎯', '🗡️', '🎯'],
                    runes: ['ᛏ', 'ᛒ', 'ᛖ', 'ᛗ']
                },
                'atena': {
                    number: 'III',
                    name: 'A MESTRA',
                    symbols: ['📚', '🦉', '📚', '🦉'],
                    runes: ['ᛚ', 'ᛝ', 'ᛟ', 'ᛞ']
                },
                'victoria': {
                    number: 'VI',
                    name: 'A GENERAL',
                    symbols: ['⚔️', '🏛️', '⚔️', '🏛️'],
                    runes: ['ᚪ', 'ᚫ', 'ᚣ', 'ᛡ']
                },
                'hestia': {
                    number: 'XV',
                    name: 'A ORÁCULO',
                    symbols: ['🔮', '👁️', '🔮', '👁️'],
                    runes: ['ᛠ', 'ᛢ', 'ᛣ', 'ᛤ']
                },
                'daedala': {
                    number: 'IV',
                    name: 'A INVENTORA',
                    symbols: ['⚙️', '🔧', '⚙️', '🔧'],
                    runes: ['ᛥ', 'ᛦ', 'ᛧ', 'ᛨ']
                }
            };

            // ============================================
            // 🎴 APLICAR ESTILO TAROT NOS CARDS
            // ============================================

            items.forEach(item => {
                const asura = item.dataset.asura;
                const info = tarotInfo[asura];

                if (info) {
                    item.classList.add('tarot-card');

                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'tarot-number';
                    numberSpan.textContent = info.number;
                    item.appendChild(numberSpan);

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'tarot-name';
                    nameSpan.textContent = info.name;
                    item.appendChild(nameSpan);

                    const positions = ['tl', 'tr', 'bl', 'br'];
                    info.symbols.forEach((sym, i) => {
                        const symSpan = document.createElement('span');
                        symSpan.className = `tarot-symbol ${positions[i]}`;
                        symSpan.textContent = sym;
                        item.appendChild(symSpan);
                    });

                    const runePositions = ['top', 'right', 'bottom', 'left'];
                    info.runes.forEach((rune, i) => {
                        const runeSpan = document.createElement('span');
                        runeSpan.className = `rune ${runePositions[i]}`;
                        runeSpan.textContent = rune;
                        item.appendChild(runeSpan);
                    });

                    const cornerRunas = ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ'];
                    const cornerPositions = ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'];
                    cornerRunas.forEach((rune, i) => {
                        const runeSpan = document.createElement('span');
                        runeSpan.className = `rune ${cornerPositions[i]}`;
                        runeSpan.textContent = rune;
                        runeSpan.style.fontSize = '10px';
                        item.appendChild(runeSpan);
                    });

                    const holoLayer = document.createElement('div');
                    holoLayer.className = 'holo-layer';
                    item.appendChild(holoLayer);

                    createCardParticles(item);
                }
            });

            // ============================================
            // 💫 PARTÍCULAS DA CARTA TAROT
            // ============================================

            function createCardParticles(item) {
                const container = document.createElement('div');
                container.className = 'particle-container';
                item.appendChild(container);

                setInterval(() => {
                    if (item.classList.contains('fade-all') || item.classList.contains('active')) return;
                    if (item.style.opacity === '0' || item.style.opacity === '0.08') return;

                    const rect = item.getBoundingClientRect();
                    if (rect.width === 0 || rect.height === 0) return;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const count = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';

                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 30 + 10;
                        const startX = centerX + Math.cos(angle) * distance - 2;
                        const startY = centerY + Math.sin(angle) * distance - 2;

                        particle.style.left = startX + 'px';
                        particle.style.top = startY + 'px';

                        const dirAngle = Math.random() * Math.PI * 2;
                        const speed = 20 + Math.random() * 40;
                        const tx = Math.cos(dirAngle) * speed;
                        const ty = Math.sin(dirAngle) * speed;

                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');
                        particle.style.setProperty('--glow-color', item.dataset.color);

                        const size = 2 + Math.random() * 4;
                        particle.style.width = size + 'px';
                        particle.style.height = size + 'px';
                        particle.style.background = item.dataset.color;
                        particle.style.boxShadow = `0 0 ${size * 2}px ${item.dataset.color}`;

                        container.appendChild(particle);

                        setTimeout(() => {
                            particle.remove();
                        }, 2000);
                    }
                }, 400);
            }

            // ============================================
            // 🎨 CORES DINÂMICAS
            // ============================================

            items.forEach(item => {
                const color = item.dataset.color;
                item.style.setProperty("--glow-color", color);
            });

            // ============================================
            // 🔊 SOM HOVER
            // ============================================

            items.forEach(item => {
                item.addEventListener("mouseenter", () => {
                    if (hoverSound) {
                        hoverSound.volume = 0.12;
                        hoverSound.currentTime = 0;
                        hoverSound.play().catch(() => {});
                    }
                });
            });

            // ============================================
            // ✨ PARTÍCULAS BACKGROUND
            // ============================================

            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            const particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
                    ctx.fill();
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                });
                requestAnimationFrame(drawParticles);
            }
            drawParticles();

            // ============================================
            // 🎵 MÚSICA AMBIENTE
            // ============================================

            if (bgMusic) {
                bgMusic.volume = 0;
                bgMusic.play().then(() => {
                    setTimeout(() => bgMusic.volume = 0.12, 800);
                }).catch(() => {
                    window.addEventListener("click", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                    window.addEventListener("touchstart", () => { bgMusic.volume = 0.12;
                        bgMusic.play(); }, { once: true });
                });
            }

            // ============================================
            // 🌌 TRANSIÇÃO PORTAL
            // ============================================

            let transitioning = false;

            function createPortalFlash(color) {
                const flash = document.createElement("div");
                flash.className = "portal-flash";
                flash.style.setProperty("--flash-color", color);
                document.body.appendChild(flash);
                requestAnimationFrame(() => flash.classList.add("show"));
                setTimeout(() => {
                    flash.classList.remove("show");
                    setTimeout(() => flash.remove(), 1000);
                }, 900);
            }

            // ============================================
            // 🚀 START TRANSITION - EFEITO "TELA CHEIA"
            // ============================================

            function startAsuraTransition(selectedItem, asura) {
                if (transitioning) return;
                transitioning = true;

                const color = selectedItem.dataset.color;
                const asuraName = selectedItem.dataset.asura;
                const imgSrc = selectedItem.querySelector('img').src;
                const glowColor = selectedItem.dataset.color;

                // Pegar todos os elementos da carta original
                const numberSpan = selectedItem.querySelector('.tarot-number');
                const nameSpan = selectedItem.querySelector('.tarot-name');
                const symbolSpans = selectedItem.querySelectorAll('.tarot-symbol');
                const runeSpans = selectedItem.querySelectorAll('.rune');
                
                const number = numberSpan ? numberSpan.textContent : '?';
                const name = nameSpan ? nameSpan.textContent : '?';
                
                // Pegar símbolos e runas
                const symbols = [];
                const runes = [];
                symbolSpans.forEach(el => symbols.push(el.textContent));
                runeSpans.forEach(el => runes.push(el.textContent));

                // ============================================
                // DETECTAR DISPOSITIVO
                // ============================================

                const isMobile = window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;
                const isTablet = window.innerWidth > 768 && window.innerWidth <= 1024;
                const isLargeScreen = window.innerWidth >= 1920;

                let fullscreenDuration = 3000;
                let sparkCount = 50;

                if (isSmallMobile) {
                    fullscreenDuration = 2500;
                    sparkCount = 25;
                } else if (isMobile) {
                    fullscreenDuration = 2700;
                    sparkCount = 35;
                } else if (isTablet) {
                    fullscreenDuration = 2800;
                    sparkCount = 45;
                } else if (isLargeScreen) {
                    fullscreenDuration = 3500;
                    sparkCount = 70;
                }

                // ============================================
                // 1. CRIAR CLONE DA CARTA EM TELA CHEIA
                // ============================================

                const clone = document.createElement('div');
                clone.className = 'portal-card-fullscreen';
                clone.style.setProperty('--glow-color', glowColor);

                // Imagem
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = asuraName;
                clone.appendChild(img);

                // Número
                const numClone = document.createElement('span');
                numClone.className = 'tarot-number-full';
                numClone.textContent = number;
                clone.appendChild(numClone);

                // Nome
                const nameClone = document.createElement('span');
                nameClone.className = 'tarot-name-full';
                nameClone.textContent = name;
                clone.appendChild(nameClone);

                // Símbolos dos cantos
                const symbolPositions = ['tl', 'tr', 'bl', 'br'];
                symbols.forEach((sym, i) => {
                    if (i < 4) {
                        const symClone = document.createElement('span');
                        symClone.className = `tarot-symbol-full ${symbolPositions[i]}`;
                        symClone.textContent = sym;
                        clone.appendChild(symClone);
                    }
                });

                // Runas das bordas
                const runePositions = ['top', 'right', 'bottom', 'left'];
                runes.forEach((rune, i) => {
                    if (i < 4) {
                        const runeClone = document.createElement('span');
                        runeClone.className = `rune-full ${runePositions[i]}`;
                        runeClone.textContent = rune;
                        clone.appendChild(runeClone);
                    }
                });

                // Holograma
                const holoClone = document.createElement('div');
                holoClone.className = 'holo-layer-full';
                clone.appendChild(holoClone);

                document.body.appendChild(clone);

                // ============================================
                // 2. CONGELAR CARROSSEL
                // ============================================

                if (slider) slider.style.animationPlayState = "paused";
                if (slider) slider.classList.add("fade-all");
                selectedItem.classList.add("active");

                // ============================================
                // 3. SOM DO PORTAL
                // ============================================

                if (hoverSound) {
                    hoverSound.volume = isMobile ? 0.15 : 0.25;
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(() => {});
                }

                // ============================================
                // 4. FADE DA MÚSICA
                // ============================================

                if (bgMusic) {
                    const fadeAudio = setInterval(() => {
                        if (bgMusic.volume > 0.02) {
                            bgMusic.volume -= isMobile ? 0.02 : 0.015;
                        } else {
                            bgMusic.volume = 0;
                            clearInterval(fadeAudio);
                        }
                    }, isMobile ? 20 : 30);
                }

                // ============================================
                // 5. OVERLAY ESCURO
                // ============================================

                const overlay = document.createElement('div');
                overlay.className = 'portal-overlay';
                overlay.style.transition = 'opacity 1.5s ease';
                document.body.appendChild(overlay);

                setTimeout(() => {
                    overlay.classList.add('active');
                }, isMobile ? 200 : 350);

                // ============================================
                // 6. PARTÍCULAS DO PORTAL
                // ============================================

                const sparkColors = [glowColor, '#ffffff', '#ffd700', '#ff6b6b', '#4ecdc4', '#ff9ff3'];
                const centerOffset = isMobile ? 15 : 20;

                for (let i = 0; i < sparkCount; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'portal-spark';
                    
                    const size = (isSmallMobile ? 1 : isMobile ? 2 : 3) + Math.random() * (isSmallMobile ? 2 : isMobile ? 3 : 5);
                    const angle = Math.random() * Math.PI * 2;
                    const distance = isMobile ? (50 + Math.random() * 150) : (100 + Math.random() * 350);
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    spark.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        background: ${sparkColors[Math.floor(Math.random() * sparkColors.length)]};
                        top: ${50 + (Math.random() - 0.5) * centerOffset}%;
                        left: ${50 + (Math.random() - 0.5) * centerOffset}%;
                        box-shadow: 0 0 ${size * (isMobile ? 2 : 4)}px ${glowColor};
                        --tx: ${tx}px;
                        --ty: ${ty}px;
                        animation-delay: ${Math.random() * (isMobile ? 0.5 : 0.8)}s;
                        animation-duration: ${(isMobile ? 1.5 : 2.0) + Math.random() * (isMobile ? 0.8 : 1.2)}s;
                        z-index: 99999;
                    `;
                    document.body.appendChild(spark);
                    
                    setTimeout(() => spark.remove(), isMobile ? 3000 : 4000);
                }

                // ============================================
                // 7. FLASH BRANCO
                // ============================================

                const flash = document.createElement('div');
                flash.style.cssText = `
                    position: fixed;
                    inset: 0;
                    background: radial-gradient(circle, white, transparent 70%);
                    z-index: 99999;
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 0.6s ease;
                `;
                document.body.appendChild(flash);

                const flashDelay = isSmallMobile ? 1800 : isMobile ? 2000 : isTablet ? 2200 : 2500;

                setTimeout(() => {
                    flash.style.opacity = isMobile ? '0.5' : '0.7';
                    setTimeout(() => {
                        flash.style.opacity = '0';
                        setTimeout(() => flash.remove(), 400);
                    }, 400);
                }, flashDelay);

                // ============================================
                // 8. CRIAR FLASH DO PORTAL (ORIGINAL)
                // ============================================

                createPortalFlash(glowColor);

                // ============================================
                // 9. BODY SCALE
                // ============================================

                document.body.style.transition = "transform 1.6s ease";
                document.body.style.transform = isMobile ? "scale(1.01)" : "scale(1.03)";

                // ============================================
                // 10. PORTAL TRANSITION (ORIGINAL)
                // ============================================

                if (portalTransition) portalTransition.classList.add("active");

                // ============================================
                // 11. LOG E REDIRECIONAMENTO
                // ============================================

                console.log(`🚀 Entrando no mundo: ${asura} (${isMobile ? 'Mobile' : isTablet ? 'Tablet' : 'Desktop'}) - Tela cheia por ${fullscreenDuration/1000}s`);

                // Remover clone após a animação
                setTimeout(() => {
                    if (clone && clone.parentNode) {
                        clone.style.transition = 'opacity 0.5s ease';
                        clone.style.opacity = '0';
                        setTimeout(() => {
                            if (clone.parentNode) clone.remove();
                        }, 500);
                    }
                }, fullscreenDuration - 500);

                setTimeout(() => {
                    window.location.href = "/world_azure/viagem.html?asura=" + asura;
                }, fullscreenDuration + 200);
            }

            // ============================================
            // 🔥 HÉCATE - SISTEMA DE BLOQUEIO E TESTE
            // ============================================

            // Função para liberar os cards
            function liberarCards() {
                console.log('🔓 Liberando cards...');
                items.forEach(item => {
                    item.style.pointerEvents = "";
                    item.style.opacity = "";
                    item.style.filter = "";
                    item.removeEventListener('click', handleCardClick);
                    item.addEventListener('click', handleCardClick);
                });
            }

            // Função para bloquear os cards
            function bloquearCards() {
                console.log('🔒 Bloqueando cards...');
                items.forEach(item => {
                    item.style.pointerEvents = "none";
                    item.style.opacity = "0.4";
                    item.style.filter = "blur(2px)";
                    item.removeEventListener('click', handleCardClick);
                });
            }

            // Handler do clique
            function handleCardClick(e) {
                const item = e.currentTarget;
                startAsuraTransition(item, item.dataset.asura);
            }

            // Executar Hécate com delay
            setTimeout(function() {
                console.log('🔍 Verificando autenticação...');
                console.log('localStorage hecate_auth_complete:', localStorage.getItem('hecate_auth_complete'));

                if (localStorage.getItem('hecate_auth_complete') === 'true') {
                    console.log('✅ Usuário já autenticado - Liberando cards');
                    liberarCards();
                } else {
                    console.log('🔒 Usuário NÃO autenticado - Bloqueando cards');
                    bloquearCards();

                    let testeAtivo = false;

                    function ativarHecate() {
                        if (testeAtivo) return;
                        testeAtivo = true;

                        console.log('🔥 Ativando Hécate...');
                        document.body.removeEventListener('click', ativarHecate);
                        document.body.removeEventListener('touchstart', ativarHecate);

                        if (typeof HecateTest !== 'undefined' && HecateTest.show) {
                            console.log('✅ HecateTest encontrado!');
                            HecateTest.show(function(success) {
                                console.log('📝 Resultado do teste:', success);
                                if (success) {
                                    console.log('✅ Teste aprovado! Liberando cards...');
                                    localStorage.setItem('hecate_auth_complete', 'true');
                                    liberarCards();
                                } else {
                                    console.log('❌ Teste falhou');
                                    testeAtivo = false;
                                    document.body.addEventListener('click', ativarHecate);
                                    document.body.addEventListener('touchstart', ativarHecate);
                                }
                            });
                        } else {
                            console.error('❌ HecateTest NÃO encontrado!');
                            console.warn('⚠️ Fallback: Liberando cards sem teste');
                            liberarCards();
                        }
                    }

                    document.body.addEventListener('click', ativarHecate);
                    document.body.addEventListener('touchstart', ativarHecate);
                    console.log('🗝️ Hécate: Toque na tela para ativar o teste');
                }
            }, 300);

        })();
    </script>

    <!-- FORÇAR BLOQUEIO MANUAL (CASO HÉCATE FALHE) -->
    <script>
        // Aguardar página carregar completamente
        window.addEventListener('load', function() {
            setTimeout(function() {
                const items = document.querySelectorAll('.item');
                const autenticado = localStorage.getItem('hecate_auth_complete') === 'true';
                
                if (!autenticado) {
                    console.log('🔒 [FALLBACK] Bloqueando cards manualmente');
                    items.forEach(item => {
                        item.style.pointerEvents = 'none';
                        item.style.opacity = '0.4';
                        item.style.filter = 'blur(2px)';
                    });
                }
            }, 1000);
        });
    </script>

</body>

</html>
